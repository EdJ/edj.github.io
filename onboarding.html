/* ── Dial (Dial.swift): 270° ring, gap at 6 o'clock ──────────────────────── */
function dialWidget(cfg) {
  // cfg: {caption, get(), set(v), defaultValue, modGet(), modSet(v), selectedMod() -> bool}
  const box = h('div', { class: 'dialbox' });
  const canvas = h('canvas');
  box.append(canvas);
  if (cfg.caption) box.append(h('div', { class: 'dial-caption' }, cfg.caption));

  let size = 0;
  let dragging = null;

  function layout() {
    const w = box.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    size = Math.min(w, isRegular() ? 112 : 80);
    const lw = size * 0.32;
    canvas.style.width = size + 'px';
    canvas.style.height = (size + lw * 0.5) + 'px';
    canvas.width = Math.round(size * DPR());
    canvas.height = Math.round((size + lw * 0.5) * DPR());
    draw();
  }

  const deg = d => d * Math.PI / 180;
  const START = 135, ARC = 270, END = 405, OVER = 4;

  function draw() {
    if (!size) return;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const lw = size * 0.32;
    ctx.clearRect(0, 0, size, size + lw);
    const cx = size / 2, cy = size / 2 + lw * 0.5;
    const rBase = (size - lw) / 2;
    const value = cfg.get();
    const modOn = cfg.selectedMod && cfg.selectedMod();
    const modAmt = cfg.modGet ? cfg.modGet() : 0;
    const hasRing = cfg.modGet && (modAmt !== 0 || (dragging && modOn));

    // track
    ctx.lineWidth = lw;
    ctx.strokeStyle = C.mid;
    ctx.beginPath(); ctx.arc(cx, cy, rBase, deg(START), deg(END)); ctx.stroke();
    // value
    if (value > 0.001) {
      ctx.strokeStyle = C.lightg;
      ctx.beginPath(); ctx.arc(cx, cy, rBase, deg(START), deg(START + value * ARC)); ctx.stroke();
    }
    // mod ring (laneOne = orange), anchored at the value, sweeping ± amount
    if (hasRing) {
      const slots = 1;
      const thick = lw / (slots + 1);
      const rRing = (size - thick) / 2;
      const anchor = START + value * ARC;
      const rawFar = anchor + modAmt * ARC;
      const far = Math.max(START - OVER, Math.min(END + OVER, rawFar));
      const a0 = Math.min(anchor, far), a1 = Math.max(anchor, far);
      ctx.lineWidth = thick;
      ctx.strokeStyle = C.orange;
      ctx.beginPath(); ctx.arc(cx, cy, rRing, deg(a0), deg(a1)); ctx.stroke();
      if (far !== rawFar) {
        ctx.fillStyle = C.orange;
        ctx.beginPath();
        ctx.arc(cx + rRing * Math.cos(deg(far)), cy + rRing * Math.sin(deg(far)), thick * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // readout
    const active = modOn ? modAmt : value;
    ctx.fillStyle = modOn ? C.orange : C.text;
    ctx.font = `500 ${Math.max(10, Math.round(size * 0.125))}px 'Geist Mono', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(Math.round(active * 100)), cx, cy);
  }

  canvas.addEventListener('pointerdown', e => {
    const modOn = cfg.selectedMod && cfg.selectedMod();
    dragging = {
      x: e.clientX, y: e.clientY,
      v: modOn ? cfg.modGet() : cfg.get(),
      mod: modOn,
    };
    capture(canvas, e);
    e.preventDefault();
    draw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = (dragging.y - e.clientY) * 0.006;
    const dx = (e.clientX - dragging.x) * 0.0025;
    let v = dragging.v + dy + dx;
    const minV = dragging.mod ? -1 : 0;
    v = Math.min(Math.max(v, minV), 1.04);
    if (v >= 0.5 && v < 0.54) v = 0.5;
    else if (v >= 0.54) v -= 0.04;
    if (!dragging.mod) {
      v = Math.min(Math.max(v, 0), 1);
      if (v < 0.03) v = 0;
      else if (v > 0.97) v = 1;
    } else {
      if (Math.abs(v) < 0.03) v = 0;
      else if (v > 0.97) v = 1;
      else if (v < -0.97) v = -1;
    }
    v = Math.round(v * 255) / 255;
    if (dragging.mod) cfg.modSet(v); else cfg.set(v);
    draw();
    e.preventDefault();
  });
  const stop = () => { dragging = null; draw(); };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('dblclick', () => {
    if (cfg.selectedMod && cfg.selectedMod()) cfg.modSet(0);
    else cfg.set(cfg.defaultValue ?? 0);
    draw();
  });

  const wdg = { el: box, layout, draw };
  widgets.push(wdg);
  return wdg;
}

/* ── Automation editor (MultiPageNoteEntry, mode .automation, 16 steps) ──── */
function autoEditorWidget(pid, opts = {}) {
  // opts: {drawing: () => bool, interactive: bool}
  const wrap = h('div', { class: 'auto-ed' });
  const laneCanvas = h('canvas');
  const stepCanvas = h('canvas');
  wrap.append(laneCanvas, stepCanvas);
  // Shorter lane on phones so the guide + lane + preset panel fit the viewport
  const laneHeight = () => isRegular() ? 160 : 108;
  let geom = null;

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    const cellW = Math.floor(w / 16);
    const stepH = Math.min(cellW, 40);
    const laneH = laneHeight();
    laneCanvas.style.height = laneH + 'px';
    laneCanvas.width = Math.round(w * DPR());
    laneCanvas.height = Math.round(laneH * DPR());
    stepCanvas.style.height = stepH + 'px';
    stepCanvas.width = Math.round(w * DPR());
    stepCanvas.height = Math.round(stepH * DPR());
    geom = { w, cellW, stepH, laneH };
    draw();
  }

  function drawLane() {
    const ctx = laneCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW } = geom;
    const H = geom.laneH;
    ctx.clearRect(0, 0, w, H);

    // playhead column (accent 20%)
    if (audio.playing && audio.current && audio.current.patternPages[pid] !== undefined && audio.step >= 0) {
      ctx.fillStyle = 'rgba(125,251,253,0.2)';
      ctx.fillRect(cellW * audio.step, 0, cellW, H);
    }
    // odd-beat shading
    for (let i = 0; i < 16; i++) {
      if (Math.floor(i / 4) % 2 === 1) {
        ctx.fillStyle = 'rgba(58,63,75,0.4)';
        ctx.fillRect(cellW * i, 0, cellW, H);
      }
    }
    // dashed quarter lines
    ctx.strokeStyle = 'rgba(58,63,75,0.9)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 2]);
    for (let d = 1; d < 4; d++) {
      ctx.beginPath();
      ctx.moveTo(0, H * d / 4); ctx.lineTo(cellW * 16, H * d / 4);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // vertical cell lines
    ctx.strokeStyle = 'rgba(58,63,75,0.7)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 16; i++) {
      ctx.beginPath(); ctx.moveTo(cellW * i, 0); ctx.lineTo(cellW * i, H); ctx.stroke();
    }
    // orange automation polyline (128 sub-values)
    const lane = patterns[pid].lane;
    ctx.strokeStyle = C.orange;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 128; i++) {
      const x = cellW * (Math.floor(i / 8) + (i % 8) / 8);
      const y = H * (1 - lane[i] / 255);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // beat separators
    drawBeatSeparators(ctx, cellW, H);
  }

  function drawBeatSeparators(ctx, cellW, H) {
    for (let i = 4; i < 16; i += 4) {
      const x = cellW * i;
      ctx.strokeStyle = C.bg; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      ctx.strokeStyle = 'rgba(139,147,166,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
  }

  function drawSteps() {
    const ctx = stepCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW, stepH } = geom;
    ctx.clearRect(0, 0, w, stepH);
    const p = patterns[pid];
    const ch = stepH * 0.2;
    const playing = audio.playing && audio.current && audio.current.patternPages[pid] !== undefined;
    for (let i = 0; i < 16; i++) {
      const x = cellW * i;
      if (playing && audio.step === i) {
        ctx.fillStyle = C.lightg;
        ctx.fillRect(x, 0, cellW, stepH);
      }
      const st = p.steps[0][i];
      ctx.fillStyle = st.on ? instColor(st.inst) : C.lightg;
      chamPath(ctx, x, 0, cellW, stepH, ch);
      ctx.fill();
      if (st.on) {
        const inset = Math.min(cellW, stepH) * 0.25;
        drawIcon(ctx, INSTRUMENTS[st.inst].icon,
          x + (cellW - (Math.min(cellW, stepH) - 2 * inset)) / 2, inset,
          Math.min(cellW, stepH) - 2 * inset, C.bg);
      }
    }
  }

  function draw() { if (geom) { drawLane(); drawSteps(); } }

  // Lane interaction: drawing mode = freehand; otherwise vertical bar-drag on one step
  if (opts.interactive !== false) {
    let drag = null;
    const setAt = (x, y) => {
      const sub = Math.max(0, Math.min(127, Math.floor(x / (geom.cellW * 16) * 128)));
      const v = Math.max(0, Math.min(1, (geom.laneH - y) / geom.laneH));
      patterns[pid].lane[sub] = Math.round(v * 255);
      return sub;
    };
    const setRange = (x0, y0, x1, y1) => {
      let a = Math.floor(x0 / (geom.cellW * 16) * 128), b = Math.floor(x1 / (geom.cellW * 16) * 128);
      let ya = y0, yb = y1;
      if (a > b) { [a, b] = [b, a]; [ya, yb] = [yb, ya]; }
      a = Math.max(0, Math.min(127, a)); b = Math.max(0, Math.min(127, b));
      const n = Math.max(1, b - a);
      for (let i = a; i <= b; i++) {
        const t = (i - a) / n;
        const y = ya + (yb - ya) * t;
        patterns[pid].lane[i] = Math.round(Math.max(0, Math.min(1, (geom.laneH - y) / geom.laneH)) * 255);
      }
    };
    laneCanvas.addEventListener('pointerdown', e => {
      if (!geom) return;
      const r = laneCanvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const drawingMode = opts.drawing ? opts.drawing() : false;
      if (drawingMode) {
        setAt(x, y);
        drag = { mode: 'draw', last: { x, y } };
      } else {
        // single-bar mode: lock to the starting step, drag sets its 8 sub-values
        const step = Math.max(0, Math.min(15, Math.floor(x / geom.cellW)));
        const v = Math.max(0, Math.min(1, (geom.laneH - y) / geom.laneH));
        for (let k = 0; k < 8; k++) patterns[pid].lane[step * 8 + k] = Math.round(v * 255);
        drag = { mode: 'bar', step };
      }
      capture(laneCanvas, e);
      audio.sendHatLane();
      drawLane();
      e.preventDefault();
    });
    laneCanvas.addEventListener('pointermove', e => {
      if (!drag || !geom) return;
      const r = laneCanvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if (drag.mode === 'draw') {
        setRange(drag.last.x, drag.last.y, x, y);
        drag.last = { x, y };
      } else {
        const v = Math.max(0, Math.min(1, (geom.laneH - y) / geom.laneH));
        for (let k = 0; k < 8; k++) patterns[pid].lane[drag.step * 8 + k] = Math.round(v * 255);
      }
      audio.sendHatLane();
      drawLane();
      e.preventDefault();
    });
    const end = () => { drag = null; };
    laneCanvas.addEventListener('pointerup', end);
    laneCanvas.addEventListener('pointercancel', end);

    stepCanvas.addEventListener('pointerdown', e => {
      if (!geom) return;
      const r = stepCanvas.getBoundingClientRect();
      const i = Math.max(0, Math.min(15, Math.floor((e.clientX - r.left) / geom.cellW)));
      const st = patterns[pid].steps[0][i];
      if (st.on && st.inst === sel.inst) st.on = false;
      else { st.on = true; st.inst = sel.inst; }
      drawSteps();
      if (audio.current && audio.current.patternPages[pid] !== undefined) audio.programBar(true);
    });
  } else {
    laneCanvas.style.pointerEvents = 'none';
    stepCanvas.style.pointerEvents = 'none';
  }

  const wdg = { el: wrap, layout, draw, onStep: () => draw() };
  widgets.push(wdg);
  return wdg;
}

/* ── Preset panel (NoteEntryPresetPanel) ─────────────────────────────────── */
function presetPanelWidget(onApply) {
  const panel = h('div', { class: 'preset-panel' });
  const chart = h('div', { class: 'pp-chart' });
  const chartCanvas = h('canvas');
  const topHandle = h('div', { class: 'pp-handle' });
  const botHandle = h('div', { class: 'pp-handle' });
  chart.append(chartCanvas, topHandle, botHandle);

  const btnX2 = tbtn('x2', { small: true, onclick: () => { preset.frequency = Math.min(8, preset.frequency * 2); refresh(); } });
  const btnD2 = tbtn('/2', { small: true, onclick: () => { preset.frequency = Math.max(1, Math.floor(preset.frequency / 2)); refresh(); } });
  const revLbl = h('span'); revLbl.innerHTML = SVG_SWAP;
  const btnRev = tbtn(revLbl, { small: true, onclick: () => { preset.reverse = !preset.reverse; refresh(); } });

  const shapes = [
    { key: 'ramp',     d: 'M2 2 L18 18' },
    { key: 'halfRamp', d: 'M2 2 L10 18 L18 18' },
    { key: 'steps',    d: 'M2 18 L6 18 L6 10 L10 10 L10 2 L14 2 L14 10 L18 10' },
    { key: 'drop',     d: 'M2 18 L10 18 L10 2 L18 2' },
  ];
  const shapeBtns = shapes.map(s => {
    const icon = h('span', { class: 'pp-shape' });
    icon.innerHTML = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="${s.d}"/></svg>`;
    return tbtn(icon, { small: true, onclick: () => { preset.type = s.key; refresh(); } });
  });

  const left = h('div', { class: 'pp-left' }, btnX2, btnD2, btnRev);
  const right = h('div', { class: 'pp-right' }, ...shapeBtns);
  panel.append(
    h('div', { class: 'pp-top' }, left, chart, right),
    h('div', { class: 'pp-div' }),
    h('div', { class: 'pp-bottom' },
      // Cancel is kept for parity with the app but inert in the tour
      (() => { const b = tbtn('Cancel', { small: true }); b.classList.add('disabled'); return b; })(),
      tbtn('Apply', { small: true, onclick: onApply })),
  );

  function layout() {
    const w = chart.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    chartCanvas.width = Math.round(w * DPR());
    chartCanvas.height = Math.round(120 * DPR());
    draw();
  }

  function draw() {
    const w = chart.offsetWidth;
    if (!w) return;
    const ctx = chartCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.clearRect(0, 0, w, 120);
    ctx.strokeStyle = C.orange;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < selectedPreset.length; i++) {
      const x = i * (w / (selectedPreset.length - 1));
      const y = 120 - selectedPreset[i] * 120;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // handles: top at the curve's end, bottom at the start (flipping with reverse)
    topHandle.style.left = (preset.reverse ? 0 : w) + 'px';
    topHandle.style.top = (120 * (1 - preset.top)) + 'px';
    botHandle.style.left = (preset.reverse ? w : 0) + 'px';
    botHandle.style.top = (120 * (1 - preset.bottom)) + 'px';
  }

  function refresh() {
    btnX2.classList.toggle('disabled', preset.frequency > 4);
    btnD2.classList.toggle('disabled', preset.frequency < 2);
    btnRev.classList.toggle('selected', preset.reverse);
    shapeBtns.forEach((b, i) => b.classList.toggle('selected', preset.type === shapes[i].key));
    recalcPreset();
    draw();
  }

  const round02 = v => Math.round(v / 0.2) * 0.2;
  function handleDrag(handle, which) {
    handle.addEventListener('pointerdown', e => {
      capture(handle, e);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e => {
      if (!handle.hasPointerCapture || !handle.hasPointerCapture(e.pointerId)) return;
      const r = chart.getBoundingClientRect();
      const v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / 120));
      if (which === 'top') {
        preset.top = round02(v);
        if (preset.top < preset.bottom) preset.bottom = preset.top;
      } else {
        preset.bottom = round02(v);
        if (preset.top < preset.bottom) preset.top = preset.bottom;
      }
      refresh();
    });
  }
  handleDrag(topHandle, 'top');
  handleDrag(botHandle, 'bottom');

  refresh();
  const wdg = { el: panel, layout, draw };
  widgets.push(wdg);
  return wdg;
}

/* ── Note grid (MultiPageNoteEntry, mode .notes, 2 pages) ────────────────── */
const SCALE_MINOR = [0, 2, 3, 5, 7, 8, 10];
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const midiName = n => NOTE_NAMES[n % 12] + Math.floor(n / 12);

function buildNotes(offset) {
  // NoteGridState.buildNotes: scale rows from baseNote 48 (C), count = scale+1
  const base = 48;
  const count = SCALE_MINOR.length + 1;
  let idx = 0 + offset;
  let octave = Math.floor(base / 12);
  const notes = [];
  for (let k = 0; k < count; k++) {
    while (idx >= SCALE_MINOR.length) { octave++; idx -= SCALE_MINOR.length; }
    while (idx < 0) { octave--; idx += SCALE_MINOR.length; }
    notes.push(SCALE_MINOR[idx] + octave * 12);
    idx++;
  }
  return notes;   // ascending
}

function noteGridWidget(pid, onPageChange) {
  const wrap = h('div', { class: 'note-ed' });
  const gridCanvas = h('canvas');
  const stepCanvas = h('canvas');
  wrap.append(gridCanvas, stepCanvas);
  const GRID_H = 208;
  let geom = null;
  const p = patterns[pid];
  const totalSteps = p.pages * 16;

  function rows() { return buildNotes(notesScrollNote); }

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    const cellW = Math.floor(w / 16);
    const stepH = Math.min(cellW, 40);
    gridCanvas.style.height = GRID_H + 'px';
    gridCanvas.width = Math.round(w * DPR());
    gridCanvas.height = Math.round(GRID_H * DPR());
    stepCanvas.style.height = stepH + 'px';
    stepCanvas.width = Math.round(w * DPR());
    stepCanvas.height = Math.round(stepH * DPR());
    geom = { w, cellW, stepH, cellH: GRID_H / rows().length };
    draw();
  }

  function stepAt(absStep) {
    const page = Math.floor(absStep / 16);
    return { st: p.steps[page][absStep % 16], nt: p.notes[page][absStep % 16], page };
  }

  function reportPages() {
    const first = Math.floor(notesScrollStep / 16);
    const last = Math.floor((notesScrollStep + 15) / 16);
    notesVisiblePages = new Set();
    for (let k = first; k <= last; k++) notesVisiblePages.add(Math.min(k, p.pages - 1));
    notesPageId = Math.floor(notesScrollStep / 16);
    if (onPageChange) onPageChange();
  }

  function drawGrid() {
    const ctx = gridCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW } = geom;
    const notes = rows();
    const nRows = notes.length;
    const cellH = GRID_H / nRows;
    geom.cellH = cellH;
    ctx.clearRect(0, 0, w, GRID_H);

    // playhead column
    const playPage = audio.current ? audio.current.patternPages[pid] : undefined;
    if (audio.playing && playPage !== undefined && audio.step >= 0) {
      const abs = playPage * 16 + audio.step;
      const xi = abs - notesScrollStep;
      if (xi >= 0 && xi < 16) {
        ctx.fillStyle = 'rgba(125,251,253,0.2)';
        ctx.fillRect(cellW * xi, 0, cellW, GRID_H);
      }
    }

    for (let xi = 0; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      if (abs >= totalSteps) break;
      const { st, nt } = stepAt(abs);
      for (let y = 0; y < nRows; y++) {
        const note = notes[nRows - y - 1];
        const isActive = st.on && ((nt.active && nt.note === note) ||
          (!nt.active && note === INSTRUMENTS[st.inst].note));
        const rx = cellW * xi, ry = cellH * y;
        if (!isActive) {
          if (xi === 0) {
            const isRoot = note % 12 === 0;
            ctx.fillStyle = isRoot ? C.lightg : C.mid;
            ctx.font = `500 10px 'Geist Mono', monospace`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(midiName(note), rx + cellW / 2, ry + cellH / 2 - 1);
          }
          continue;
        }
        ctx.fillStyle = instColor(st.inst);
        ctx.fillRect(rx, ry, cellW, cellH);
        ctx.fillStyle = C.bg;
        ctx.font = `500 10px 'Geist Mono', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(midiName(note), rx + cellW / 2, ry + cellH / 2 - 1);
      }
      // out-of-view indicators
      if (st.on && nt.active) {
        const lo = notes[0], hi = notes[nRows - 1];
        if (nt.note > hi) { ctx.fillStyle = instColor(st.inst); ctx.fillRect(cellW * xi, 0, cellW, cellH * 0.2); }
        if (nt.note < lo) { ctx.fillStyle = instColor(st.inst); ctx.fillRect(cellW * xi, GRID_H - cellH * 0.2, cellW, cellH * 0.2); }
      }
    }
    // ghost while moving a note
    if (moveDrag) {
      const gAbs = moveDrag.srcAbs + moveDrag.dStep;
      const xi = gAbs - notesScrollStep;
      const kIdx = moveDrag.srcRowK + moveDrag.dRow;
      if (xi >= 0 && xi < 16 && kIdx >= 0 && kIdx < nRows) {
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = instColor(4);
        ctx.fillRect(cellW * xi, cellH * (nRows - kIdx - 1), cellW, cellH);
        ctx.globalAlpha = 1;
      }
    }

    // odd-beat shading over cells (drawGrid comes after notes in the app)
    for (let xi = 0; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      if (Math.floor(abs / 4) % 2 === 1) {
        ctx.fillStyle = 'rgba(58,63,75,0.25)';
        ctx.fillRect(cellW * xi, 0, cellW, GRID_H);
      }
    }
    // horizontal lines
    ctx.strokeStyle = C.mid;
    ctx.lineWidth = 1;
    for (let y = 0; y <= nRows; y++) {
      ctx.beginPath(); ctx.moveTo(0, cellH * y); ctx.lineTo(cellW * 16, cellH * y); ctx.stroke();
    }
    // vertical lines
    ctx.strokeStyle = 'rgba(58,63,75,0.7)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= 16; x++) {
      ctx.beginPath(); ctx.moveTo(cellW * x, 0); ctx.lineTo(cellW * x, GRID_H); ctx.stroke();
    }
    // beat + page separators
    for (let xi = 1; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      const isPage = abs % 16 === 0;
      const isBeat = abs % 4 === 0;
      if (!isPage && !isBeat) continue;
      const x = cellW * xi;
      if (isPage) {
        ctx.strokeStyle = C.bg; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_H); ctx.stroke();
        ctx.strokeStyle = C.lightg; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x - 2, 0); ctx.lineTo(x - 2, GRID_H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 2, 0); ctx.lineTo(x + 2, GRID_H); ctx.stroke();
      } else {
        ctx.strokeStyle = C.bg; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_H); ctx.stroke();
        ctx.strokeStyle = 'rgba(139,147,166,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_H); ctx.stroke();
      }
    }
  }

  function drawSteps() {
    const ctx = stepCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW, stepH } = geom;
    ctx.clearRect(0, 0, w, stepH);
    const ch = stepH * 0.2;
    const playPage = audio.current ? audio.current.patternPages[pid] : undefined;
    for (let xi = 0; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      if (abs >= totalSteps) break;
      const { st, page } = stepAt(abs);
      const x = cellW * xi;
      if (audio.playing && playPage === page && audio.step === abs % 16) {
        ctx.fillStyle = C.lightg;
        ctx.fillRect(x, 0, cellW, stepH);
      }
      ctx.fillStyle = st.on ? instColor(st.inst) : C.lightg;
      chamPath(ctx, x, 0, cellW, stepH, ch);
      ctx.fill();
      if (st.on) {
        const s = Math.min(cellW, stepH);
        const inset = s * 0.25;
        drawIcon(ctx, INSTRUMENTS[st.inst].icon, x + (cellW - (s - 2 * inset)) / 2, inset, s - 2 * inset, C.bg);
      }
    }
  }

  function draw() { if (geom) { drawGrid(); drawSteps(); } }

  // interactions
  let pdrag = null;      // scroll drag
  let moveDrag = null;   // note move drag

  function cellFromEvent(e) {
    const r = gridCanvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const xi = Math.floor(x / geom.cellW);
    const yi = Math.floor(y / geom.cellH);
    const notes = rows();
    if (xi < 0 || xi >= 16 || yi < 0 || yi >= notes.length) return null;
    return { xi, yi, note: notes[notes.length - yi - 1], rowK: notes.length - yi - 1 };
  }

  gridCanvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const cell = cellFromEvent(e);
    pdrag = {
      x: e.clientX, y: e.clientY,
      startStep: notesScrollStep, startNote: notesScrollNote,
      moved: false, cell,
    };
    if (cell) {
      const abs = notesScrollStep + cell.xi;
      if (abs < totalSteps) {
        const { st, nt } = stepAt(abs);
        if (st.on && nt.active && nt.note === cell.note) {
          pdrag.candidateMove = { srcAbs: abs, srcNote: cell.note, srcRowK: cell.rowK };
        }
      }
    }
    capture(gridCanvas, e);
    e.preventDefault();
  });

  gridCanvas.addEventListener('pointermove', e => {
    if (!pdrag || !geom) return;
    const dx = e.clientX - pdrag.x;
    const dy = e.clientY - pdrag.y;
    if (!pdrag.moved && Math.hypot(dx, dy) < 8) return;
    pdrag.moved = true;

    if (pdrag.candidateMove) {
      moveDrag = {
        ...pdrag.candidateMove,
        dStep: Math.round(dx / geom.cellW),
        dRow: Math.round(-dy / geom.cellH),
      };
      drawGrid();
      return;
    }
    // scroll: horizontal steps + vertical scale degrees
    const maxOff = Math.max(0, totalSteps - 16);
    notesScrollStep = Math.max(0, Math.min(maxOff, pdrag.startStep + Math.round(dx / geom.cellW) * -1));
    const nOff = pdrag.startNote + Math.round(dy / geom.cellH) * -1 * -1;
    // vertical: dragging up shows higher notes (offset up)
    notesScrollNote = Math.max(-14, Math.min(21, pdrag.startNote + Math.round(dy / geom.cellH)));
    reportPages();
    draw();
  });

  gridCanvas.addEventListener('pointerup', e => {
    if (!pdrag) return;
    if (moveDrag) {
      // commit note move
      const src = stepAt(moveDrag.srcAbs);
      const tgtAbs = moveDrag.srcAbs + moveDrag.dStep;
      const notes = rows();
      const kIdx = moveDrag.srcRowK + moveDrag.dRow;
      if (tgtAbs >= 0 && tgtAbs < totalSteps && kIdx >= 0 && kIdx < notes.length &&
          (tgtAbs !== moveDrag.srcAbs || kIdx !== moveDrag.srcRowK)) {
        const tgt = stepAt(tgtAbs);
        src.st.on = false; src.nt.active = false;
        tgt.st.on = true; tgt.st.inst = 4;
        tgt.nt.active = true; tgt.nt.note = notes[kIdx];
      }
      moveDrag = null;
      if (audio.current) audio.programBar(true);
      draw();
    } else if (!pdrag.moved && pdrag.cell) {
      // tap: toggle note
      const abs = notesScrollStep + pdrag.cell.xi;
      if (abs < totalSteps) {
        const { st, nt } = stepAt(abs);
        const note = pdrag.cell.note;
        if (!st.on) {
          st.on = true; st.inst = sel.inst;
          nt.active = true; nt.note = note;
        } else {
          const activeNote = nt.active ? nt.note : INSTRUMENTS[st.inst].note;
          if (activeNote === note && st.inst === sel.inst) {
            st.on = false; nt.active = false;
          } else {
            st.on = true; st.inst = sel.inst;
            nt.active = true; nt.note = note;
          }
        }
        if (audio.current) audio.programBar(true);
        draw();
      }
    }
    pdrag = null;
  });
  gridCanvas.addEventListener('pointercancel', () => { pdrag = null; moveDrag = null; });

  stepCanvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const r = stepCanvas.getBoundingClientRect();
    const xi = Math.max(0, Math.min(15, Math.floor((e.clientX - r.left) / geom.cellW)));
    const abs = notesScrollStep + xi;
    if (abs >= totalSteps) return;
    const { st, nt } = stepAt(abs);
    if (st.on && st.inst === sel.inst) { st.on = false; }
    else {
      st.on = true; st.inst = sel.inst;
      if (!nt.active) { nt.active = true; nt.note = INSTRUMENTS[sel.inst].note; }
    }
    if (audio.current) audio.programBar(true);
    draw();
  });

  const wdg = {
    el: wrap, layout, draw,
    onStep: () => draw(),
    scrollToPage(page) {
      notesScrollStep = page * 16;
      reportPages();
      draw();
    },
  };
  widgets.push(wdg);
  return wdg;
}

/* ── Page selector (UnifiedPatternView.PageSelector, allowsResize: false) ── */
function pageSelectorWidget(pid, onSelect) {
  const p = patterns[pid];
  const wrap = h('div', { class: 'pagesel' });
  wrap.append(h('span', { class: 'ps-chip' }, 'Page'));
  const btns = [];
  for (let i = 0; i < p.pages; i++) {
    const b = h('button', { class: 'ps-btn' }, String(i + 1));
    const bar = h('span', { class: 'playbar' });
    b.append(bar);
    b.addEventListener('click', () => onSelect(i));
    btns.push({ b, bar });
    wrap.append(b);
  }
  function update() {
    const playPage = audio.playing && audio.current ? audio.current.patternPages[pid] : undefined;
    btns.forEach(({ b, bar }, i) => {
      b.classList.toggle('hl', notesVisiblePages.has(i));
      bar.classList.toggle('on', playPage === i);
    });
  }
  update();
  const wdg = { el: wrap, layout() {}, draw: update, onStep: update };
  widgets.push(wdg);
  return wdg;
}

/* ── Mod source selector (screen 7) ──────────────────────────────────────── */
let selectedMod = null; // null | 'laneOne'
function modSelectorWidget(dial) {
  const wrapper = h('div', { class: 'modsel-wrap' });
  const btn = tbtn('Modulation', { small: true });
  const menu = h('div', { class: 'modsel-menu' });
  const optNone = h('div', { class: 'modsel-item' }, 'None');
  const optLane = h('div', { class: 'modsel-item lane1' }, 'Pattern Lane');
  menu.append(optNone, optLane);
  wrapper.append(btn, menu, dial.el);

  function setMod(m) {
    selectedMod = m;
    btn.querySelector('.ti').textContent = m === 'laneOne' ? 'Pattern Lane' : 'Modulation';
    btn.style.color = m === 'laneOne' ? C.orange : '';
    menu.classList.remove('open');
    dial.draw();
  }
  btn.addEventListener('click', () => menu.classList.toggle('open'));
  optNone.addEventListener('click', () => setMod(null));
  optLane.addEventListener('click', () => setMod('laneOne'));
  // Tapping away dismisses, like the app's pop-up button — otherwise the open
  // menu sits on top of the dial the next hint asks you to drag. The listener
  // retires itself once the screen has been replaced.
  const dismiss = e => {
    if (!document.body.contains(wrapper)) { document.removeEventListener('pointerdown', dismiss); return; }
    if (!wrapper.contains(e.target)) menu.classList.remove('open');
  };
  document.addEventListener('pointerdown', dismiss);
  return { el: wrapper, layout() { dial.layout(); }, draw() { dial.draw(); } };
}

/* ── Pattern grid (CanvasPatternGrid, segmentCount 1, embedded) ──────────── */
function patternGridWidget() {
  const wrap = h('div', { class: 'grid-wrap' });
  const canvas = h('canvas');
  wrap.append(canvas);
  const CELL = 44, FOOTER = 12, CHAM = 8;
  const SEG_W = CELL * 4, GRID_H = CELL * 4 + FOOTER;
  let geom = null;
  let hold = null, drag = null;

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    canvas.style.height = GRID_H + 'px';
    canvas.width = Math.round(w * DPR());
    canvas.height = Math.round(GRID_H * DPR());
    geom = { w, offX: Math.max(0, (w - SEG_W) / 2) };
    draw();
  }

  function draw() {
    if (!geom) return;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.clearRect(0, 0, geom.w, GRID_H);
    const ox = geom.offX;

    let dropTarget = null;
    if (drag && !drag.external) dropTarget = hitCell(drag.x, drag.y);

    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        const x = ox + col * CELL + 1, y = row * CELL + 1;
        const cw = CELL - 2, chh = CELL - 2;
        const pid = grid[row][col];
        const isSource = drag && drag.srcRow === row && drag.srcCol === col;
        if (isSource) {
          ctx.fillStyle = 'rgba(58,63,75,0.3)';
          chamPath(ctx, x, y, cw, chh, CHAM); ctx.fill();
        } else if (pid !== null) {
          const p = patterns[pid];
          const isSel = sel.pattern === pid;
          const multi = p.pages > 1;
          ctx.fillStyle = ROW_COLORS[p.color];
          if (isSel) { ctx.fillRect(x, y, cw, chh); }
          else { chamPath(ctx, x, y, cw, chh, CHAM, { skipBottomRight: multi }); ctx.fill(); }
          if (isSel) {
            ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
            ctx.strokeRect(x, y, cw, chh);
          }
          const icon = patternIcon(p);
          if (icon) {
            const pad = cw * 0.25;
            drawIcon(ctx, icon, x + pad, y + pad, cw - 2 * pad, C.bg);
          }
          if (multi) {
            ctx.fillStyle = C.bg;
            ctx.font = `700 ${Math.max(8, cw * 0.3)}px 'Geist Mono', monospace`;
            ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
            ctx.fillText(String(p.pages), x + cw - cw * 0.08, y + chh - cw * 0.08);
          }
        } else {
          ctx.fillStyle = C.mid;
          chamPath(ctx, x, y, cw, chh, CHAM); ctx.fill();
        }
        if (dropTarget && dropTarget.row === row && dropTarget.col === col && !isSource) {
          ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
          chamPath(ctx, x, y, cw, chh, CHAM); ctx.stroke();
        }
      }
    }
    // footer
    ctx.fillStyle = GROUP_COLORS[0];
    chamPath(ctx, ox, 4 * CELL, SEG_W, FOOTER, Math.min(CHAM, FOOTER / 2));
    ctx.fill();

    // internal drag ghost
    if (drag && !drag.external) {
      const p = patterns[drag.pid];
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = ROW_COLORS[p.color];
      chamPath(ctx, drag.x - CELL / 2, drag.y - CELL / 2, CELL, CELL, CHAM);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
      chamPath(ctx, drag.x - CELL / 2, drag.y - CELL / 2, CELL, CELL, CHAM);
      ctx.stroke();
      const icon = patternIcon(p);
      if (icon) drawIcon(ctx, icon, drag.x - CELL / 4, drag.y - CELL / 4, CELL / 2, C.bg);
      ctx.globalAlpha = 1;
    }
  }

  function hitCell(x, y) {
    const col = Math.floor((x - geom.offX) / CELL);
    const row = Math.floor(y / CELL);
    if (col < 0 || col > 3 || row < 0 || row > 3) return null;
    return { row, col };
  }

  canvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const cell = hitCell(x, y);
    // The hold replaces the app's haptic: when it fires on a pattern, the drag
    // starts right away (ghost under the finger) so it's obvious it's armed.
    hold = {
      x, y, cell, fired: false, gx: e.clientX, gy: e.clientY,
      timer: setTimeout(() => {
        if (!hold) return;
        hold.fired = true;
        if (!hold.cell) return;
        const pid = grid[hold.cell.row][hold.cell.col];
        if (pid === null) return;
        drag = { pid, srcRow: hold.cell.row, srcCol: hold.cell.col, x: hold.x, y: hold.y, gx: hold.gx, gy: hold.gy, external: false };
        hold = null;
        draw();
      }, 250),
    };
    capture(canvas, e);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', e => {
    if (!geom) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (drag) {
      drag.x = x; drag.y = y;
      drag.gx = e.clientX; drag.gy = e.clientY;
      drag.external = y < 0 && !!externalDropTarget;
      if (drag.external) drawOverlayGhost(drag);
      else hideOverlayGhost();
      if (externalDropTarget) externalDropTarget.onExternalDrag(drag);
      draw();
      return;
    }
    // Moving before the hold fires is a swipe, not a hold — abandon it (app
    // behaviour: >12pt during .pending cancels the hold timer).
    if (hold && !hold.fired && Math.hypot(x - hold.x, y - hold.y) > 12) {
      clearTimeout(hold.timer);
      hold = null;
    }
  });

  canvas.addEventListener('pointerup', e => {
    if (drag) {
      if (drag.external && externalDropTarget) {
        externalDropTarget.onExternalDrop(drag);
      } else {
        const tgt = hitCell(drag.x, drag.y);
        if (tgt && (tgt.row !== drag.srcRow || tgt.col !== drag.srcCol)) {
          const displaced = grid[tgt.row][tgt.col];
          grid[tgt.row][tgt.col] = drag.pid;
          grid[drag.srcRow][drag.srcCol] = displaced;
          syncGridColors();
          sel.pattern = drag.pid;
          const d = dominantInstrument(patterns[drag.pid]);
          if (d !== null) sel.inst = d;
        }
      }
      hideOverlayGhost();
      drag = null;
      if (externalDropTarget) externalDropTarget.onExternalDrag(null);
      draw();
      widgets.forEach(w => w !== wdg && w.draw && w.draw());
      if (hold) { clearTimeout(hold.timer); hold = null; }
      return;
    }
    if (hold) {
      clearTimeout(hold.timer);
      if (!hold.fired && hold.cell) {
        // tap: select
        const pid = grid[hold.cell.row][hold.cell.col];
        if (pid !== null) {
          sel.pattern = pid;
          const d = dominantInstrument(patterns[pid]);
          if (d !== null) sel.inst = d;
        }
        draw();
        widgets.forEach(w => w !== wdg && w.draw && w.draw());
      }
      hold = null;
    }
  });
  canvas.addEventListener('pointercancel', () => {
    if (hold) clearTimeout(hold.timer);
    hold = null; drag = null; hideOverlayGhost();
    if (externalDropTarget) externalDropTarget.onExternalDrag(null);
    draw();
  });

  const wdg = { el: wrap, layout, draw, onStep() {} };
  widgets.push(wdg);
  return wdg;
}

// Cross-grid drag plumbing (pattern grid → loop group editor)
let externalDropTarget = null;
const overlayCanvas = document.getElementById('drag-overlay');
function drawOverlayGhost(drag) {
  overlayCanvas.classList.add('on');
  overlayCanvas.width = Math.round(window.innerWidth * DPR());
  overlayCanvas.height = Math.round(window.innerHeight * DPR());
  const ctx = overlayCanvas.getContext('2d');
  ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  const p = patterns[drag.pid];
  const s = 44;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = ROW_COLORS[p.color];
  chamPath(ctx, drag.gx - s / 2, drag.gy - s / 2, s, s, 8);
  ctx.fill();
  const icon = patternIcon(p);
  if (icon) drawIcon(ctx, icon, drag.gx - s / 4, drag.gy - s / 4, s / 2, C.bg);
  ctx.globalAlpha = 1;
}
function hideOverlayGhost() {
  overlayCanvas.classList.remove('on');
}

/* ── Loop group carousel (CanvasLoopGroupCarousel / CanvasLoopGroupEdit) ─── */
function loopGroupCarouselWidget(cfg) {
  // cfg: {groups: () => [{group, index}], height, single: bool, onCentered(idx)}
  const wrap = h('div', { class: 'lg-wrap' });
  const canvas = h('canvas');
  wrap.append(canvas);
  const HEIGHT = cfg.height || 200;
  const CELL = 36, PAD = 8, SPACING = 8, PROG_H = 20;
  let geom = null;
  let scroll = { offset: 0, centered: cfg.initialCentered ?? 0 };
  let touch = null;
  let cellDrag = null;   // dragging a placed pattern within the editor
  let hoverCell = null;  // drop-target cell during an internal drag
  let extHover = null;   // {groupI, s, v, pid} during an external (grid) drag

  const itemH = () => PAD + VOICE_COUNT * CELL + PROG_H + PAD;

  function items() { return cfg.groups(); }
  function layouts() {
    let x = 0;
    return items().map(it => {
      const w = it.group.sections.length * CELL + 2 * PAD;
      const l = { x, w, it };
      x += w + SPACING;
      return l;
    });
  }
  function centeredOffset(idx, ls) {
    const l = ls[idx];
    return l.x + l.w / 2 - geom.w / 2;
  }

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    canvas.style.height = HEIGHT + 'px';
    canvas.width = Math.round(w * DPR());
    canvas.height = Math.round(HEIGHT * DPR());
    geom = { w };
    const ls = layouts();
    scroll.centered = Math.min(scroll.centered, ls.length - 1);
    scroll.offset = centeredOffset(scroll.centered, ls);
    draw();
  }

  function startTimes() { return calcStartTimes(); }

  function draw() {
    if (!geom) return;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.clearRect(0, 0, geom.w, HEIGHT);
    const ls = layouts();
    const top = (HEIGHT - itemH()) / 2;
    const times = startTimes();

    ls.forEach((l, i) => {
      const sx = l.x - scroll.offset;
      if (sx + l.w < -CELL || sx > geom.w + CELL) return;
      const isCentered = i === scroll.centered;
      ctx.globalAlpha = isCentered ? 1 : 0.5;
      drawItem(ctx, l, sx, top, times[l.it.index], isCentered);
      ctx.globalAlpha = 1;
    });

    // drop-target footprint (pattern preview, like the composer's drawHoverFootprint)
    const hov = cellDrag && hoverCell ? { ...hoverCell, pid: cellDrag.pid } : extHover;
    if (hov) drawFootprint(ctx, ls, top, hov);

    // internal cell-drag ghost
    if (cellDrag) {
      const p = patterns[cellDrag.pid];
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = ROW_COLORS[p.color];
      chamPath(ctx, cellDrag.x - CELL / 2, cellDrag.y - CELL / 2, CELL, CELL, 8);
      ctx.fill();
      const icon = patternIcon(p);
      if (icon) drawIcon(ctx, icon, cellDrag.x - CELL / 4, cellDrag.y - CELL / 4, CELL / 2, C.bg);
      ctx.globalAlpha = 1;
    }
  }

  function drawItem(ctx, l, sx, top, startTime, isCentered) {
    const g = l.it.group;
    // card
    ctx.fillStyle = C.lightg;
    chamPath(ctx, sx, top, l.w, itemH(), 8);
    ctx.fill();

    for (let s = 0; s < g.sections.length; s++) {
      for (let v = 0; v < VOICE_COUNT; v++) {
        const cx = sx + PAD + s * CELL;
        const cy = top + PAD + v * CELL + 1;
        const chh = CELL - 2;
        const cell = resolveCell(g, s, v);
        if (cell.type === 'empty') {
          ctx.fillStyle = C.mid;
          chamPath(ctx, cx, cy, CELL, chh, 8); ctx.fill();
        } else if (cell.type === 'direct') {
          const p = patterns[cell.pid];
          const multi = p.pages > 1;
          const dim = cellDrag && cellDrag.srcGroupI === l.it.index && cellDrag.srcS === s && cellDrag.srcV === v;
          ctx.globalAlpha *= dim ? 0.35 : 1;
          ctx.fillStyle = ROW_COLORS[p.color];
          chamPath(ctx, cx, cy, CELL, chh, 8, { skipBottomRight: multi }); ctx.fill();
          const icon = patternIcon(p);
          if (icon) { const pad = CELL * 0.25; drawIcon(ctx, icon, cx + pad, cy + pad - 1, CELL - 2 * pad, C.bg); }
          if (multi) {
            ctx.fillStyle = C.bg;
            ctx.font = `700 10px 'Geist Mono', monospace`;
            ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
            ctx.fillText(String(p.pages), cx + CELL - 3, cy + chh - 2);
          }
          ctx.globalAlpha = isCentered ? 1 : 0.5;
        } else {
          const p = patterns[cell.pid];
          ctx.globalAlpha *= 0.3;
          ctx.fillStyle = ROW_COLORS[p.color];
          chamPath(ctx, cx, cy, CELL, chh, 8); ctx.fill();
          const icon = patternIcon(p);
          if (icon) { const pad = CELL * 0.25; drawIcon(ctx, icon, cx + pad, cy + pad - 1, CELL - 2 * pad, C.bg); }
          ctx.globalAlpha = isCentered ? 1 : 0.5;
        }
      }
    }

    // start time
    ctx.fillStyle = C.bg;
    ctx.font = `10px 'Geist Mono', monospace`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(startTime, sx + PAD + 2, top + itemH() - PAD - PROG_H / 2);

    // playing-section progress in the bottom strip
    if (audio.playing && audio.current && audio.current.sectionKey) {
      const [gi, si] = audio.current.sectionKey.split(':').map(Number);
      if (gi === l.it.index && audio.step >= 0) {
        const barW = (l.w - 2 * PAD);
        const segW = barW / g.sections.length;
        const px = sx + PAD + si * segW;
        const pw = segW * (audio.step + 1) / 16;
        ctx.fillStyle = C.mid;
        chamPath(ctx, px, top + itemH() - PAD - 8, pw, 6, 2);
        ctx.fill();
      }
    }
  }

  function hitCell(x, y) {
    const ls = layouts();
    const top = (HEIGHT - itemH()) / 2;
    for (const l of ls) {
      const sx = l.x - scroll.offset;
      const lx = x - sx, ly = y - top - PAD;
      if (lx >= PAD && lx < PAD + l.it.group.sections.length * CELL && ly >= 0 && ly < VOICE_COUNT * CELL) {
        return { groupI: l.it.index, s: Math.floor((lx - PAD) / CELL), v: Math.floor(ly / CELL) };
      }
    }
    return null;
  }

  // Preview of the pattern as it would sit if dropped: first cell in the direct
  // style, multi-page continuation cells as ghosts, capped at the next occupied
  // cell in the same voice row (CanvasLoopGroupCarousel.drawHoverFootprint).
  function drawFootprint(ctx, ls, top, hov) {
    const l = ls.find(L => L.it.index === hov.groupI);
    if (!l) return;
    const g = l.it.group;
    const p = patterns[hov.pid];
    if (!p) return;
    let droppable = g.sections.length - hov.s;
    for (let k = 1; k < droppable; k++) {
      const nxt = g.sections[hov.s + k][hov.v];
      if (nxt !== null && nxt !== undefined) { droppable = k; break; }
    }
    const count = Math.max(1, Math.min(p.pages, droppable));
    const sx = l.x - scroll.offset;
    const icon = patternIcon(p);
    ctx.save();
    ctx.globalAlpha = 0.65;
    for (let k = 0; k < count; k++) {
      const cx = sx + PAD + (hov.s + k) * CELL;
      const cy = top + PAD + hov.v * CELL + 1;
      const chh = CELL - 2;
      if (k > 0) ctx.globalAlpha = 0.65 * 0.3;
      ctx.fillStyle = ROW_COLORS[p.color];
      chamPath(ctx, cx, cy, CELL, chh, 8, { skipBottomRight: k === 0 && count > 1 });
      ctx.fill();
      if (icon) { const pad = CELL * 0.25; drawIcon(ctx, icon, cx + pad, cy + pad - 1, CELL - 2 * pad, C.bg); }
      if (k === 0 && count > 1) {
        ctx.fillStyle = C.bg;
        ctx.font = `700 10px 'Geist Mono', monospace`;
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        ctx.fillText(String(p.pages), cx + CELL - 3, cy + chh - 2);
      }
    }
    ctx.restore();
  }

  canvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const cell = hitCell(x, y);
    touch = {
      x, y, startOffset: scroll.offset, cell, moved: false, fired: false,
      // Hold fired on a placed pattern → drag starts immediately (the web
      // stand-in for the app's haptic-then-drag).
      timer: setTimeout(() => {
        if (!touch || touch.moved) return;
        touch.fired = true;
        if (!touch.cell) return;
        const pid = loopGroups[touch.cell.groupI].sections[touch.cell.s][touch.cell.v];
        if (pid === null || pid === undefined) return;
        cellDrag = { pid, srcGroupI: touch.cell.groupI, srcS: touch.cell.s, srcV: touch.cell.v, x: touch.x, y: touch.y };
        hoverCell = touch.cell;
        draw();
      }, 250),
    };
    capture(canvas, e);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', e => {
    if (!touch || !geom) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (cellDrag) {
      cellDrag.x = x; cellDrag.y = y;
      hoverCell = hitCell(x, y);
      draw();
      return;
    }
    const dx = x - touch.x, dy = y - touch.y;
    if (!touch.moved && Math.hypot(dx, dy) < 10) return;
    // Movement before the hold fires cancels it: this is a swipe/scroll
    clearTimeout(touch.timer);
    touch.moved = true;
    if (!cfg.single) {
      scroll.offset = touch.startOffset - dx;
      const ls = layouts();
      // live nearest highlight
      const center = scroll.offset + geom.w / 2;
      let best = 0, bd = Infinity;
      ls.forEach((l, i) => { const d = Math.abs(l.x + l.w / 2 - center); if (d < bd) { bd = d; best = i; } });
      scroll.centered = best;
      draw();
    }
  });

  canvas.addEventListener('pointerup', e => {
    if (!touch) return;
    clearTimeout(touch.timer);
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;

    if (cellDrag) {
      const tgt = hitCell(x, y);
      const srcG = loopGroups[cellDrag.srcGroupI];
      if (tgt) {
        const tgtG = loopGroups[tgt.groupI];
        if (tgt.groupI === cellDrag.srcGroupI && tgt.s === cellDrag.srcS && tgt.v === cellDrag.srcV) {
          // dropped back — no-op
        } else {
          const displaced = tgtG.sections[tgt.s][tgt.v];
          tgtG.sections[tgt.s][tgt.v] = cellDrag.pid;
          srcG.sections[cellDrag.srcS][cellDrag.srcV] = displaced ?? null;
        }
      } else {
        // dragged out — remove
        srcG.sections[cellDrag.srcS][cellDrag.srcV] = null;
      }
      cellDrag = null;
      hoverCell = null;
      touch = null;
      if (audio.playing) audio.programBar(true);
      draw();
      return;
    }

    if (!touch.moved && !touch.fired && touch.cell) {
      // tap on a cell
      const g = loopGroups[touch.cell.groupI];
      const pid = g.sections[touch.cell.s][touch.cell.v];
      if (sel.pattern !== null) {
        if (pid === sel.pattern) {
          g.sections[touch.cell.s][touch.cell.v] = null;
        } else {
          const row = g.sections[touch.cell.s];
          const firstIdx = row.indexOf(sel.pattern);
          if (firstIdx >= 0) row[firstIdx] = null;
          g.sections[touch.cell.s][touch.cell.v] = sel.pattern;
        }
        if (audio.playing) audio.programBar(true);
      } else if (pid !== null && pid !== undefined) {
        sel.pattern = pid;
      }
      draw();
      widgets.forEach(w => w !== wdg && w.draw && w.draw());
    } else if (!touch.moved && !touch.fired && !touch.cell) {
      // tap outside cells: deselect pattern
      if (sel.pattern !== null) {
        sel.pattern = null;
        widgets.forEach(w => w.draw && w.draw());
      } else if (cfg.onDeselect) cfg.onDeselect();
    } else if (touch.moved && !cfg.single) {
      // snap to nearest
      const ls = layouts();
      scroll.offset = centeredOffset(scroll.centered, ls);
      if (cfg.onCentered) cfg.onCentered(items()[scroll.centered].index);
      draw();
    }
    touch = null;
  });
  canvas.addEventListener('pointercancel', () => { touch = null; cellDrag = null; hoverCell = null; draw(); });

  const wdg = {
    el: wrap, layout, draw, onStep: () => draw(),
    // external drag (from pattern grid) support
    onExternalDrag(drag) {
      if (!drag || !drag.external) { if (extHover) { extHover = null; draw(); } return; }
      const r = canvas.getBoundingClientRect();
      const x = drag.gx - r.left, y = drag.gy - r.top;
      const cell = (x >= 0 && x <= r.width && y >= 0 && y <= r.height) ? hitCell(x, y) : null;
      extHover = cell ? { ...cell, pid: drag.pid } : null;
      draw();
    },
    onExternalDrop(drag) {
      const r = canvas.getBoundingClientRect();
      const x = drag.gx - r.left, y = drag.gy - r.top;
      const cell = (x >= 0 && x <= r.width && y >= 0 && y <= r.height) ? hitCell(x, y) : null;
      if (cell) {
        const g = loopGroups[cell.groupI];
        const row = g.sections[cell.s];
        const firstIdx = row.indexOf(drag.pid);
        if (firstIdx >= 0 && firstIdx !== cell.v) row[firstIdx] = null;
        g.sections[cell.s][cell.v] = drag.pid;
        if (audio.playing) audio.programBar(true);
      }
      extHover = null;
      draw();
    },
  };
  widgets.push(wdg);
  return wdg;
}

/* ── Song overview (CanvasLoopGroupView) — screen 12 ─────────────────────── */
function songOverviewWidget(onOpenGroup) {
  const wrap = h('div', { class: 'song-wrap' });
  const canvas = h('canvas');
  wrap.append(canvas);
  const HEIGHT = 200;
  const SP_V = 2, PAD_H = 10, PAD_V = 10, SPACING = 8;
  const PROG_H = 6, TIME_H = 12, PLAY_S = 36;
  let geom = null;
  let scroll = { offset: 0 };
  let touch = null, cardDrag = null;
  const menu = document.getElementById('holdmenu');

  function cellSize() {
    const fill = isRegular() ? 0.6 : 0.4;
    const target = HEIGHT * fill;
    const fixed = 2 * PAD_V + 4 + TIME_H + 4 + PROG_H;
    return Math.max(14, (target - fixed - (VOICE_COUNT - 1) * SP_V) / VOICE_COUNT);
  }
  const gridH = () => VOICE_COUNT * cellSize() + (VOICE_COUNT - 1) * SP_V;
  const itemH = () => PAD_V + gridH() + 4 + TIME_H + 4 + PROG_H + PAD_V;
  const itemW = g => 2 * PAD_H + g.sections.length * cellSize();

  function layouts() {
    let x = 0;
    return loopGroups.map(g => {
      const w = itemW(g);
      const l = { x, w, g };
      x += w + SPACING;
      return l;
    });
  }
  function clampOffset(off, ls) {
    const minOff = -(geom.w / 2 - ls[0].w / 2);
    const total = ls[ls.length - 1].x + ls[ls.length - 1].w + SPACING + 52;
    const maxOff = Math.max(minOff, total - geom.w / 2);
    return Math.max(minOff, Math.min(maxOff, off));
  }
  function centeredOffset(idx, ls) {
    return ls[idx].x + ls[idx].w / 2 - geom.w / 2;
  }

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    canvas.style.height = HEIGHT + 'px';
    canvas.width = Math.round(w * DPR());
    canvas.height = Math.round(HEIGHT * DPR());
    geom = { w };
    const ls = layouts();
    sel.highlightedGroup = Math.min(sel.highlightedGroup, ls.length - 1);
    scroll.offset = clampOffset(centeredOffset(sel.highlightedGroup, ls), ls);
    draw();
  }

  function draw() {
    if (!geom) return;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.clearRect(0, 0, geom.w, HEIGHT);
    const ls = layouts();
    const top = (HEIGHT - itemH()) / 2;
    const cs = cellSize();
    const times = calcStartTimes();

    // insertion line while reordering
    if (cardDrag) {
      const idx = insertionIndex(cardDrag.x, ls);
      let lineX;
      if (idx === 0) lineX = ls[0].x - scroll.offset - SPACING / 2;
      else if (idx < ls.length) lineX = (ls[idx - 1].x + ls[idx - 1].w + ls[idx].x) / 2 - scroll.offset;
      else lineX = ls[ls.length - 1].x + ls[ls.length - 1].w + SPACING / 2 - scroll.offset;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(lineX, top - 4); ctx.lineTo(lineX, top + itemH() + 4); ctx.stroke();
    }

    ls.forEach((l, i) => {
      const sx = l.x - scroll.offset;
      if (sx + l.w < -cs || sx > geom.w + cs) return;
      const isHl = sel.highlightedGroup === i;
      ctx.globalAlpha = isHl ? 1 : 0.45;
      drawCard(ctx, l.g, sx, top, cs, isHl, times[i]);
      ctx.globalAlpha = 1;
    });

    // add / duplicate buttons after content
    const afterX = ls[ls.length - 1].x + ls[ls.length - 1].w + SPACING - scroll.offset;
    if (afterX < geom.w) {
      const gap = 8;
      const startY = top + (itemH() - (2 * PLAY_S + gap)) / 2;
      [['plus', 0], ['dup', 1]].forEach(([kind, i]) => {
        const by = startY + i * (PLAY_S + gap);
        ctx.fillStyle = C.mid;
        chamPath(ctx, afterX, by, PLAY_S, PLAY_S, 8); ctx.fill();
        ctx.strokeStyle = C.lightg; ctx.lineWidth = 2; ctx.fillStyle = C.lightg;
        const cx = afterX + PLAY_S / 2, cy = by + PLAY_S / 2;
        if (kind === 'plus') {
          ctx.beginPath(); ctx.moveTo(cx - 7, cy); ctx.lineTo(cx + 7, cy);
          ctx.moveTo(cx, cy - 7); ctx.lineTo(cx, cy + 7); ctx.stroke();
        } else {
          ctx.strokeRect(cx - 2, cy - 7, 9, 9);
          ctx.strokeRect(cx - 7, cy - 2, 9, 9);
        }
      });
    }

    // drag ghost card
    if (cardDrag) {
      const g = loopGroups[cardDrag.idx];
      ctx.globalAlpha = 0.75;
      drawCard(ctx, g, cardDrag.x - itemW(g) / 2, top, cs, false, calcStartTimes()[cardDrag.idx]);
      ctx.globalAlpha = 1;
    }

    // progress bar on playing section
    if (audio.playing && audio.current && audio.current.sectionKey && audio.step >= 0) {
      const [gi, si] = audio.current.sectionKey.split(':').map(Number);
      if (gi < ls.length) {
        const l = ls[gi];
        const sx = l.x - scroll.offset;
        const barY = top + PAD_V + gridH() + 4 + TIME_H + 4;
        const barW = l.w - 2 * PAD_H;
        const segW = barW / l.g.sections.length;
        const pw = segW * (audio.step + 1) / 16;
        ctx.fillStyle = C.lightg;
        chamPath(ctx, sx + PAD_H + si * segW, barY, pw, PROG_H, 2);
        ctx.fill();
      }
    }

    // play button under highlighted card
    const hlL = ls[sel.highlightedGroup];
    if (hlL) {
      const cx = hlL.x + hlL.w / 2 - scroll.offset;
      const cy = top + itemH() + 8 + PLAY_S / 2;
      ctx.fillStyle = C.mid;
      ctx.beginPath(); ctx.arc(cx, cy, PLAY_S / 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.lightg;
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy - 6); ctx.lineTo(cx + 7, cy); ctx.lineTo(cx - 4, cy + 6);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawCard(ctx, g, sx, top, cs, isHl, startTime) {
    ctx.fillStyle = isHl ? C.mid : C.dark;
    chamPath(ctx, sx, top, itemW(g), itemH(), 8);
    ctx.fill();
    if (isHl) {
      ctx.strokeStyle = 'rgba(139,147,166,0.5)'; ctx.lineWidth = 1.5;
      chamPath(ctx, sx, top, itemW(g), itemH(), 8); ctx.stroke();
    }
    for (let s = 0; s < g.sections.length; s++) {
      for (let v = 0; v < VOICE_COUNT; v++) {
        const cx = sx + PAD_H + s * cs;
        const cy = top + PAD_V + v * (cs + SP_V) + 0.5;
        const cell = resolveCell(g, s, v);
        const ch = cs * 0.2;
        if (cell.type === 'empty') {
          ctx.fillStyle = 'rgba(30,34,44,0.6)';
          chamPath(ctx, cx, cy, cs, cs - 1, ch); ctx.fill();
        } else if (cell.type === 'direct') {
          ctx.fillStyle = ROW_COLORS[patterns[cell.pid].color];
          chamPath(ctx, cx, cy, cs, cs - 1, ch); ctx.fill();
        } else {
          ctx.globalAlpha *= 0.3;
          ctx.fillStyle = ROW_COLORS[patterns[cell.pid].color];
          chamPath(ctx, cx, cy, cs, cs - 1, ch); ctx.fill();
          ctx.globalAlpha /= 0.3;
        }
      }
    }
    ctx.fillStyle = C.lightg;
    ctx.font = `9px 'Geist Mono', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(startTime, sx + itemW(g) / 2, top + PAD_V + gridH() + 4 + TIME_H / 2);
  }

  function hitCard(x, y, ls) {
    const top = (HEIGHT - itemH()) / 2;
    if (y < top || y > top + itemH()) return null;
    for (let i = 0; i < ls.length; i++) {
      const sx = ls[i].x - scroll.offset;
      if (x >= sx && x < sx + ls[i].w) return i;
    }
    return null;
  }
  function insertionIndex(x, ls) {
    for (let i = 0; i < ls.length; i++) {
      let gapCenter;
      if (i === 0) gapCenter = ls[0].x - scroll.offset - SPACING / 2;
      else gapCenter = (ls[i - 1].x + ls[i - 1].w + ls[i].x) / 2 - scroll.offset;
      if (x < gapCenter) return i;
    }
    return ls.length;
  }

  function showMenu(idx, clientX, clientY) {
    menu.innerHTML = '';
    const dup = h('div', { class: 'hm-btn' });
    dup.innerHTML = SVG_DUP;
    dup.addEventListener('click', () => {
      const copy = JSON.parse(JSON.stringify(loopGroups[idx]));
      loopGroups.splice(idx + 1, 0, copy);
      hideMenu(); layout();
    });
    const del = h('div', { class: 'hm-btn danger' });
    del.innerHTML = SVG_TRASH;
    del.addEventListener('click', () => {
      if (loopGroups.length > 1) {
        loopGroups.splice(idx, 1);
        if (sel.highlightedGroup >= loopGroups.length) sel.highlightedGroup = loopGroups.length - 1;
        if (audio.pos.groupIdx >= loopGroups.length) audio.pos.groupIdx = 0;
      }
      hideMenu(); layout();
    });
    menu.append(dup, del);
    menu.classList.add('open');
    const mw = 104;
    menu.style.left = Math.max(4, Math.min(window.innerWidth - mw - 4, clientX - mw / 2)) + 'px';
    menu.style.top = (clientY - 64) + 'px';
    const dismiss = ev => {
      if (!menu.contains(ev.target)) { hideMenu(); window.removeEventListener('pointerdown', dismiss, true); }
    };
    setTimeout(() => window.addEventListener('pointerdown', dismiss, true), 0);
  }
  function hideMenu() { menu.classList.remove('open'); }

  canvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    touch = {
      x, y, cx: e.clientX, cy: e.clientY, startOffset: scroll.offset, moved: false, fired: false,
      timer: setTimeout(() => { if (touch && !touch.moved) touch.fired = true; }, 300),
    };
    capture(canvas, e);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (!touch || !geom) return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (cardDrag) { cardDrag.x = x; draw(); return; }
    const dx = x - touch.x;
    if (!touch.moved && Math.abs(dx) < 10 && Math.hypot(dx, y - touch.y) < 10) return;
    const ls = layouts();
    if (touch.fired) {
      // Hold has fired on a card: further movement means reorder-drag, never scroll
      const idx = hitCard(touch.x, touch.y, ls);
      if (idx !== null) {
        if (Math.hypot(dx, y - touch.y) > 15) {
          cardDrag = { idx, x };
          draw();
        }
        return;
      }
    }
    // Movement before the hold fires cancels it — this is a scroll
    clearTimeout(touch.timer);
    touch.moved = true;
    scroll.offset = clampOffset(touch.startOffset - dx, ls);
    // live highlight follows nearest
    const center = scroll.offset + geom.w / 2;
    let best = 0, bd = Infinity;
    ls.forEach((l, i) => { const d = Math.abs(l.x + l.w / 2 - center); if (d < bd) { bd = d; best = i; } });
    sel.highlightedGroup = best;
    draw();
  });
  canvas.addEventListener('pointerup', e => {
    if (!touch) return;
    clearTimeout(touch.timer);
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const ls = layouts();

    if (cardDrag) {
      let idx = insertionIndex(x, ls);
      const [g] = loopGroups.splice(cardDrag.idx, 1);
      if (idx > cardDrag.idx) idx--;
      loopGroups.splice(idx, 0, g);
      sel.highlightedGroup = idx;
      cardDrag = null; touch = null;
      layout();
      return;
    }

    if (!touch.moved) {
      if (touch.fired) {
        const idx = hitCard(touch.x, touch.y, ls);
        if (idx !== null) showMenu(idx, touch.cx, touch.cy);
      } else {
        const idx = hitCard(x, y, ls);
        const top = (HEIGHT - itemH()) / 2;
        // play button?
        const hlL = ls[sel.highlightedGroup];
        const pcx = hlL.x + hlL.w / 2 - scroll.offset;
        const pcy = top + itemH() + 8 + PLAY_S / 2;
        if (Math.hypot(x - pcx, y - pcy) <= PLAY_S / 2) {
          // Play the song from the highlighted group, restarting immediately
          audio.mode = { type: 'song', startGroup: sel.highlightedGroup };
          sel.loopGroup = null;
          audio.pos = { sectionIdx: 0, groupIdx: sel.highlightedGroup };
          if (nav.changingTo === null) audio.forceRestart();
        } else if (idx !== null && idx === sel.highlightedGroup) {
          onOpenGroup(idx);
          return;
        } else if (idx !== null) {
          sel.highlightedGroup = idx;
          scroll.offset = clampOffset(centeredOffset(idx, ls), ls);
        } else {
          // add/dup buttons after content
          const afterX = ls[ls.length - 1].x + ls[ls.length - 1].w + SPACING - scroll.offset;
          const gap = 8;
          const startY = top + (itemH() - (2 * PLAY_S + gap)) / 2;
          if (x >= afterX && x < afterX + PLAY_S) {
            if (y >= startY && y < startY + PLAY_S) {
              loopGroups.push({ sections: [[null, null, null]] });
              layout();
            } else if (y >= startY + PLAY_S + gap && y < startY + 2 * PLAY_S + gap) {
              loopGroups.push(JSON.parse(JSON.stringify(loopGroups[sel.highlightedGroup])));
              layout();
            }
          }
        }
        draw();
      }
    } else {
      scroll.offset = clampOffset(centeredOffset(sel.highlightedGroup, ls), ls);
      draw();
    }
    touch = null;
  });
  canvas.addEventListener('pointercancel', () => { touch = null; cardDrag = null; draw(); });

  const wdg = { el: wrap, layout, draw, onStep: () => draw() };
  widgets.push(wdg);
  return wdg;
}

  return h('div', { class: 'olayout' },
    h('div', { class: 'ol-info' }, info),
    h('div', { class: 'ol-content' },
      h('div', { class: 'ol-content-inner' }, ...contentChildren)));
}

            ['download', 'Download Jolt and keep these beats going', '/'],
            ['mail', 'Questions or feedback — hi@joltgroovebox.com', 'mailto:hi@joltgroovebox.com'],
          ],
        }));
    },
  },
];

/* ═══════════════════════════════════════════════════════════════════════════
   Navigation — bar-quantised transitions (Onboarding.transition(to:))
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Sound indicator — reports what the browser lets us know ──────────────────
   States: off (audio blocked / not started, tap to enable), on (context running,
   meter shows live engine output), muted (tapped off), fail (engine unavailable).
   A dancing meter with no audible sound ⇒ the device itself is silenced, which
   the web cannot detect. */

const SND_SVG = {
  on:  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/></svg>',
  off: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>',
};

const sound = {
  state: null,
  muted: false,
  raf: null,

  setState(s, title) {
    if (this.state === s) return;
    this.state = s;
    const pill = document.getElementById('sound-pill');
    pill.classList.remove('snd-on', 'snd-off', 'snd-fail');
    pill.classList.add(s === 'on' ? 'snd-on' : s === 'fail' ? 'snd-fail' : 'snd-off');
    pill.title = title;
    document.getElementById('snd-ic').innerHTML = s === 'on' ? SND_SVG.on : SND_SVG.off;
    if (s === 'on') this.startMeter();
  },

  update() {
    if (audio.failed) {
      this.setState('fail', 'Audio is unavailable in this browser');
    } else if (!audio.actx || audio.actx.state !== 'running') {
      this.setState('off', 'Sound is off — tap to enable');
    } else if (this.muted) {
      this.setState('muted', 'Muted — tap to unmute');
    } else {
      this.setState('on', "Sound is on — if you can't hear it, check your device volume");
    }
    soundCheck.refresh();
  },

  startMeter() {
    if (this.raf || !audio.analyser) return;
    const data = new Uint8Array(audio.analyser.fftSize);
    const SPAN = [8, 12, 6];
    const tick = () => {
      if (this.state !== 'on' || !audio.analyser) { this.raf = null; return; }
      audio.analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (let i = 0; i < data.length; i += 4) {
        const d = Math.abs(data[i] - 128);
        if (d > peak) peak = d;
      }
      const p = Math.min(1, peak / 80);
      // Re-queried each frame: the welcome screen's sound-check meter comes and
      // goes with navigation while the nav pill's is permanent
      document.querySelectorAll('#sound-pill .meter i, #sound-check .meter i')
        .forEach((bar, i) => { bar.style.height = (3 + p * SPAN[i % 3]) + 'px'; });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },
};

document.getElementById('sound-pill').addEventListener('click', async () => {
  if (audio.failed) return;
  if (!audio.actx || audio.actx.state !== 'running') {
    // A tap is a user gesture: init and/or resume, then start this screen's audio
    await audio.init();
    audio.nudgeResume();
    const scr = SCREENS[nav.current];
    if (!audio.playing && scr.audio && scr.audio.type !== 'none') {
      audio.applyScreenAudio(scr, false);
    }
    sound.update();
    return;
  }
  sound.muted = !sound.muted;
  // Engine-side mute: DecayEnv-shaped fade in the worklet, so no click
  audio.send({ type: 'set_mute', on: sound.muted });
  sound.state = null;   // force class refresh
  sound.update();
});

/* ── Sound check (welcome screen) — up-front "this demo plays audio" trigger.
   Tapping it is the user gesture that unlocks audio and previews screen 1's
   groove, so the visitor can confirm they actually hear something before
   starting. States: idle (tap to hear), on (beat playing, live meter), fail. */
const soundCheck = {
  busy: false,

  stateOf() {
    if (audio.failed) return 'fail';
    if (audio.actx && audio.actx.state === 'running' && audio.playing && !sound.muted) return 'on';
    return 'idle';
  },

  build() {
    const btn = h('button', { id: 'sound-check', type: 'button' });
    btn.addEventListener('click', () => this.tap());
    this.render(btn);
    return btn;
  },

  render(btn) {
    const s = this.stateOf();
    if (btn.dataset.sc === s) return;
    btn.dataset.sc = s;
    btn.className = 'sc-' + s;
    const [t, sub] = {
      idle: ['Sound check — tap to hear the beat', 'This demo plays audio. Make sure your sound is on.'],
      on:   ['Sound is on', 'Hear the beat? If not, turn up your volume. Tap to pause.'],
      fail: ['Audio unavailable', 'This browser can’t run the audio engine — the demo will be visual-only.'],
    }[s];
    btn.innerHTML =
      `<span class="sc-in"><span class="sc-ic">${s === 'fail' ? SND_SVG.off : SND_SVG.on}` +
      `<span class="meter"><i></i><i></i><i></i></span></span>` +
      `<span class="sc-tx"><span class="sc-t">${t}</span><span class="sc-s">${sub}</span></span></span>`;
  },

  refresh() {
    const btn = document.getElementById('sound-check');
    if (btn) this.render(btn);
  },

  async tap() {
    if (audio.failed || this.busy) return;
    if (this.stateOf() === 'on') {
      audio.setMode({ type: 'none' });   // pause the preview
      sound.update();
      return;
    }
    this.busy = true;
    try {
      await audio.init();
    } finally {
      this.busy = false;
    }
    audio.nudgeResume();
    if (sound.muted) {
      sound.muted = false;
      audio.send({ type: 'set_mute', on: false });
      sound.state = null;
    }
    // Preview screen 1's pattern so there is something to hear right away;
    // navigating on keeps it rolling seamlessly (same pattern, bar-quantised)
    if (!audio.playing && audio.wNode) audio.applyScreenAudio(SCREENS[1], false);
    sound.update();
  },
};

const nav = {
  current: 0,
  changingTo: null,
  fallbackTimer: null,
  // Synchronous re-entry guard: `changingTo` is only set after the async
  // audio.init() await, so without this a second click in that window would
  // pass the changingTo check and race the first.
  busy: false,

  async go(target) {
    if (this.busy) return;
    this.busy = true;
    try {
      await audio.init();
    } finally {
      this.busy = false;
    }
    if (!audio.playing || !audio.wNode) {
      clearTimeout(this.fallbackTimer);
      audio.armedFor = null;
      this.current = target;
      this.changingTo = null;
      renderScreen();
      audio.applyScreenAudio(SCREENS[target], false);
      this.updateButtons();
      return;
    }
    // Playing: queue for the next bar start (audio pre-armed at step 15). If step
    // messages stop arriving (suspended tab, engine stall), force-complete after
    // ~2 bars so the Back/Next buttons can never be stranded disabled.
    this.changingTo = target;
    this.updateButtons();
    clearTimeout(this.fallbackTimer);
    const barMs = 16 * (60 / BPM / 4) * 1000;
    this.fallbackTimer = setTimeout(() => {
      if (this.changingTo !== target) return;
      audio.applyScreenAudio(SCREENS[target], false);
      audio.armedFor = null;
      this.completeTransition();
    }, barMs * 2 + 400);
  },

  completeTransition() {
    if (this.changingTo === null) return;
    clearTimeout(this.fallbackTimer);
    this.current = this.changingTo;
    this.changingTo = null;
    renderScreen();
    const scr = SCREENS[this.current];
    if (!scr.audio || scr.audio.type === 'none') audio.setMode({ type: 'none' });
    this.updateButtons();
  },

  updateButtons() {
    const back = document.getElementById('btn-back');
    const next = document.getElementById('btn-next');
    back.classList.toggle('hidden', this.current === 0 && this.changingTo === null);
    const busy = this.changingTo !== null;
    back.classList.toggle('disabled', busy);
    next.classList.toggle('disabled', busy);
    next.querySelector('.ti').textContent =
      this.current === 0 ? 'Start' :
      this.current === SCREENS.length - 1 ? 'Finish' : 'Next';
    // progress segments
    const prog = document.getElementById('progress');
    if (prog.children.length !== SCREENS.length) {
      prog.innerHTML = '';
      for (let i = 0; i < SCREENS.length; i++) prog.append(h('span', { class: 'pseg' }));
    }
    [...prog.children].forEach((seg, i) => {
      seg.classList.toggle('on', i === this.current);
      seg.classList.toggle('past', i < this.current);
    });
    sound.update();
  },
};

function leaveOnboarding() {
  if (audio.playing) audio.send({ type: 'stop' });
  window.location.href = '/';
}

document.getElementById('btn-back').addEventListener('click', () => {
  if (nav.changingTo !== null || nav.busy) return;
  if (nav.current > 0) nav.go(nav.current - 1);
});
document.getElementById('btn-next').addEventListener('click', () => {
  if (nav.changingTo !== null || nav.busy) return;
  if (nav.current < SCREENS.length - 1) nav.go(nav.current + 1);
  else leaveOnboarding();
});

function renderScreen() {
  widgets = [];
  externalDropTarget = null;
  document.getElementById('holdmenu').classList.remove('open');
  const scr = SCREENS[nav.current];
  if (scr.onEnter) scr.onEnter();
  const root = document.getElementById('screen-root');
  root.innerHTML = '';
  root.append(scr.build());
  widgets.forEach(w => w.layout && w.layout());
  requestAnimationFrame(() => widgets.forEach(w => w.layout && w.layout()));
  nav.updateButtons();
}

/* ── Resize / init ───────────────────────────────────────────────────────── */

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => widgets.forEach(w => w.layout && w.layout()), 120);
});

document.fonts.ready.then(() => widgets.forEach(w => w.draw && w.draw()));

renderScreen();
</script>
</body>
</html>
