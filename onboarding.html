<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jolt Groovebox | Onboarding</title>
<style>
/* ── Fonts (Clinical Dark set, matching the app) ─────────────────────────── */
@font-face {
  font-family: 'Chakra Petch';
  src: url('fonts/ChakraPetch-SemiBold.ttf') format('truetype');
  font-weight: 600; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Chakra Petch';
  src: url('fonts/ChakraPetch-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Geist Mono';
  src: url('geist/GeistMono/webfonts/GeistMono-Regular.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Geist Mono';
  src: url('geist/GeistMono/webfonts/GeistMono-Medium.woff2') format('woff2');
  font-weight: 500; font-style: normal; font-display: swap;
}

/* ── ColorScheme (InertiaApp.swift) ──────────────────────────────────────── */
:root {
  --bg:      #0B0C0F;
  --darker:  #14161D;
  --dark:    #1E222C;
  --mid:     #3A3F4B;
  --text:    #EDEFF3;
  --lightg:  #8B93A6;
  --accent:  #7DFBFD;
  --orange:  #FF9500;
  /* panel chamfer: all four corners, 8px */
  --cham8: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
                   calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  /* button chamfer: diagonal cut, top-left + bottom-right only, 6px */
  --diag6: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  --diag5: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  font-size: 16px;
  overflow: hidden;
  overscroll-behavior: none;
}

#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 8px;
  gap: 8px;
}

#screen-root {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ── OnboardingLayout: compact = stacked, regular = two equal columns ────── */
.olayout {
  flex: 1; min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ol-info {
  flex: none;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}
.ol-content {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  padding: 0 4px;
}
.ol-content-inner {
  width: 100%;
  max-width: 560px;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 0;
}
@media (min-width: 768px) {
  .olayout { flex-direction: row; }
  .ol-info    { flex: 1 1 0; min-width: 0; }
  .ol-content { flex: 1 1 0; min-width: 0; }
}

/* ── FullPage: compact = full width, regular = centered half width ───────── */
.fullpage {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
.fullpage .tpanel { width: 100%; }
@media (min-width: 768px) {
  .fullpage .tpanel { width: 50%; }
}

/* ── Text panel (Onboarding.createTextPanel) ─────────────────────────────── */
.tpanel {
  background: var(--mid);
  padding: 16px;
  text-align: center;
  clip-path: var(--cham8);
  width: 100%;
  max-width: 560px;
}
.tpanel h1 {
  font-family: 'Chakra Petch', sans-serif;
  font-weight: 600;
  font-size: 18px;
  line-height: 1.25;
  margin: 0 0 16px;
}
.tpanel p {
  font-size: 16px;
  line-height: 1.3;
  margin: 0 0 8px;
}
.tpanel p:last-child { margin-bottom: 0; }

/* ── ToggleableButtonStyle / InstrumentButtonStyle ───────────────────────── */
.tbtn {
  appearance: none; -webkit-appearance: none;
  border: none; margin: 0; padding: 1px;
  background: var(--mid);            /* border colour layer */
  clip-path: var(--diag6);
  cursor: pointer;
  font-family: 'Geist Mono', monospace;
  display: inline-flex;
  height: 48px; min-width: 40px;
  flex-shrink: 0;
  color: var(--lightg);
  user-select: none; touch-action: manipulation;
}
.tbtn .ti {
  clip-path: var(--diag5);
  background: var(--dark);           /* fill layer */
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0 8px;
  font-size: 16px;
  color: inherit;
  min-width: 0; white-space: nowrap;
}
.tbtn.small { height: 32px; min-width: 28px; }
.tbtn.small .ti { font-size: 16px; padding: 0 6px; }
.tbtn.caption .ti { font-size: 10px; font-weight: 500; }
.tbtn.selected { background: var(--btnc, var(--lightg)); color: var(--bg); }
.tbtn.selected .ti { background: var(--btnc, var(--lightg)); }
.tbtn:active:not(.disabled) .ti { background: var(--btnc, var(--lightg)); color: var(--bg); }
.tbtn.disabled { color: var(--mid); pointer-events: none; }
.tbtn svg { display: block; }

/* Instrument chip: 32x32 small, coloured border + glyph, fill on select */
.ichip { height: 32px; width: 32px; min-width: 28px; background: var(--chipc); color: var(--chipc); }
.ichip .ti { background: var(--dark); padding: 0; }
.ichip.selected { color: var(--bg); }
.ichip.selected .ti { background: var(--chipc); }
.ichip svg { width: 24px; height: 24px; }

/* ── Rows / misc ─────────────────────────────────────────────────────────── */
.seqrow { width: 100%; }
.seqrow canvas { display: block; width: 100%; touch-action: none; cursor: pointer; }
.vdivider { width: 100%; height: 1px; background: rgba(255,255,255,0.15); flex-shrink: 0; }
.chiprow { display: flex; gap: 8px; justify-content: center; }

.dialgroup-row {
  width: 100%;
  display: flex; justify-content: space-evenly; align-items: flex-start;
}
.dialcol { display: flex; flex-direction: column; align-items: center; }
.iswatch { width: 36px; height: 36px; margin-bottom: 12px; position: relative;
           display: flex; align-items: center; justify-content: center; }
.iswatch svg { width: 24px; height: 24px; color: var(--bg); }

.dialbox { width: 80px; display: flex; flex-direction: column; align-items: center; }
@media (min-width: 768px) { .dialbox { width: 112px; } }
.dialbox canvas { display: block; touch-action: none; cursor: ns-resize; }
.dial-caption { font-size: 10px; font-weight: 500; padding-top: 4px; color: var(--text); text-align: center; }

/* ── Automation editor ───────────────────────────────────────────────────── */
.auto-ed { width: 100%; }
.auto-ed canvas { display: block; width: 100%; touch-action: none; }
.toolrow { width: 100%; display: flex; align-items: center; }
.toolrow .sp { flex: 1; }

/* ── Preset panel (NoteEntryPresetPanel) — rounded, not chamfered ────────── */
.preset-panel {
  width: 100%;
  background: var(--dark);
  border-radius: 12px;
  overflow: hidden;
  flex-shrink: 0;
}
.pp-top { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0; }
.pp-left  { width: 44px; display: flex; flex-direction: column; gap: 6px; align-items: center; flex-shrink: 0; }
.pp-right { width: 40px; display: flex; flex-direction: column; gap: 6px; align-items: center; flex-shrink: 0; }
.pp-chart { position: relative; flex: 1; height: 120px; min-width: 0; }
.pp-chart canvas { display: block; width: 100%; height: 120px; background: rgba(139,147,166,0.2); }
.pp-handle {
  position: absolute; width: 36px; height: 36px; border-radius: 50%;
  background: rgba(139,147,166,0.3);
  transform: translate(-50%, -50%);
  touch-action: none; cursor: grab;
}
.pp-div { height: 1px; background: var(--mid); margin-top: 8px; }
.pp-bottom { display: flex; justify-content: space-between; padding: 12px; }
.pp-shape svg { width: 20px; height: 20px; }

/* ── Mod source selector ─────────────────────────────────────────────────── */
.modsel-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.modsel-menu {
  position: absolute; top: 36px; z-index: 40;
  background: var(--dark);
  border: 1px solid var(--mid);
  border-radius: 8px;
  min-width: 160px;
  overflow: hidden;
  display: none;
}
.modsel-menu.open { display: block; }
.modsel-item { padding: 9px 14px; font-size: 13px; color: var(--lightg); cursor: pointer; white-space: pre; }
.modsel-item:hover { background: var(--mid); }
.modsel-item.lane1 { color: var(--orange); }

/* ── Page selector ───────────────────────────────────────────────────────── */
.pagesel { display: flex; align-items: center; width: 100%; }
.pagesel .ps-chip {
  font-size: 12px; color: var(--bg);
  background: var(--lightg);
  height: 32px; padding: 0 8px;
  display: inline-flex; align-items: center;
  clip-path: var(--cham8);
  flex-shrink: 0;
}
.pagesel .ps-btn {
  position: relative;
  width: 32px; height: 32px;
  font-family: 'Geist Mono', monospace; font-size: 12px;
  color: var(--bg);
  background: var(--mid);
  border: none; padding: 0; cursor: pointer;
  clip-path: var(--cham8);
}
.pagesel .ps-btn.hl { background: var(--lightg); }
.pagesel .ps-btn .playbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: transparent;
}
.pagesel .ps-btn .playbar.on { background: var(--accent); }

.note-ed { width: 100%; }
.note-ed canvas { display: block; width: 100%; touch-action: none; }

/* ── Canvas widgets ──────────────────────────────────────────────────────── */
.grid-wrap, .lg-wrap, .song-wrap { width: 100%; }
.grid-wrap canvas, .lg-wrap canvas, .song-wrap canvas {
  display: block; width: 100%; touch-action: none;
}

/* Song-view hold menu */
.holdmenu {
  position: fixed; z-index: 60;
  display: none;
  background: var(--dark);
  border-radius: 8px;
  padding: 8px;
  gap: 0;
  align-items: center;
}
.holdmenu.open { display: flex; }
.holdmenu .hm-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--lightg);
}
.holdmenu .hm-btn.danger { color: rgba(255,59,48,0.8); }
.holdmenu svg { width: 18px; height: 18px; }

/* ── Nav (Back / Next) ───────────────────────────────────────────────────── */
#navrow { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
#btn-back.hidden { visibility: hidden; }

/* Drag ghost overlay */
#drag-overlay {
  position: fixed; inset: 0; z-index: 50;
  pointer-events: none;
  display: none;
}
#drag-overlay.on { display: block; }
</style>
</head>
<body>

<div id="app">
  <div id="screen-root"></div>
  <div id="navrow">
    <button class="tbtn" id="btn-back"><span class="ti">Back</span></button>
    <button class="tbtn" id="btn-next"><span class="ti">Next</span></button>
  </div>
</div>
<canvas id="drag-overlay"></canvas>
<div class="holdmenu" id="holdmenu"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   Constants — ported from Easter (Jolt iOS app)
   ═══════════════════════════════════════════════════════════════════════════ */

const C = {
  bg:     '#0B0C0F',
  darker: '#14161D',
  dark:   '#1E222C',
  mid:    '#3A3F4B',
  text:   '#EDEFF3',
  lightg: '#8B93A6',
  accent: '#7DFBFD',
  orange: '#FF9500',
};

// InstrumentPalette.swift — 20 colours
const PALETTE = [
  '#7DFBFD','#64D2FF','#A3DFE5','#32E5C8','#CFFB52',
  '#99E673','#34C759','#00FF41','#FFBA36','#FF9500',
  '#FF5500','#FF3B30','#FF2D8C','#FCF1A1','#EA3EE7',
  '#BF5AF2','#0080FF','#5E5CE6','#9B59FF','#4A1FB8',
];

// PatternColors (PatternComposerView.swift)
const ROW_COLORS = [
  '#7DFBFD','#64D2FF','#A3DFE5','#32E5C8','#CFFB52','#99E673','#34C759','#00FF41',
  '#FFBA36','#FF9500','#FF5500','#FF3B30','#EA3EE7','#BF5AF2','#0080FF','#5E5CE6',
  '#9B59FF','#4A1FB8',
];
const GROUP_COLORS = ['#7DFBFD','#CFFB52','#FF5500','#EA3EE7'];

// Pixel-art instrument icons (Easter/svg/*.svg, 16x16, packed y*16+x)
const ICON_PX = {
  kick: [21,22,23,24,25,26,36,42,43,51,59,60,66,76,77,82,87,92,93,98,102,104,108,109,114,118,120,124,125,130,135,140,141,147,151,155,156,164,167,170,171,179,181,182,183,184,185,186,188,194,198,199,200,201,205],
  hihat: [39,40,55,56,67,68,69,70,71,72,73,74,75,76,82,83,87,88,92,93,97,103,104,110,114,115,116,117,118,119,120,121,122,123,124,125,135,136,151,152,167,168,183,184,199,200,215,216],
  snare: [19,28,36,43,53,58,70,73,100,101,102,103,104,105,106,107,115,124,130,141,146,157,162,163,172,173,178,180,181,182,183,184,185,186,187,189,194,205,211,220,228,229,230,231,232,233,234,235],
  waves: [18,22,23,28,29,34,37,39,43,45,50,53,55,59,61,66,68,71,74,77,82,84,87,89,93,98,99,103,105,109,114,119,120,125,146,152,153,154,155,156,157,162,168,173,178,184,189,194,200,205,210,216,221,226,227,228,229,230,231,232,237],
};

function iconSvg(key, sizePx) {
  const rects = (ICON_PX[key] || []).map(p =>
    `<rect x="${p % 16}" y="${Math.floor(p / 16)}" width="1" height="1"/>`).join('');
  return `<svg viewBox="0 0 16 16" fill="currentColor"${sizePx ? ` width="${sizePx}" height="${sizePx}"` : ''}>${rects}</svg>`;
}

function drawIcon(ctx, key, x, y, size, color) {
  const px = ICON_PX[key];
  if (!px) return;
  const u = size / 16;
  ctx.fillStyle = color;
  for (const p of px) ctx.fillRect(x + (p % 16) * u, y + Math.floor(p / 16) * u, u + 0.05, u + 0.05);
}

const isRegular = () => window.matchMedia('(min-width: 768px)').matches;
const DPR = () => window.devicePixelRatio || 1;

const capture = (el, e) => { try { capture(el, e); } catch {} };

function chamPath(ctx, x, y, w, h, r, opts = {}) {
  const skipBR = !!opts.skipBottomRight;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.lineTo(x + w, y + r);
  if (skipBR) { ctx.lineTo(x + w, y + h); }
  else { ctx.lineTo(x + w, y + h - r); ctx.lineTo(x + w - r, y + h); }
  ctx.lineTo(x + r, y + h); ctx.lineTo(x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.closePath();
}

/* ═══════════════════════════════════════════════════════════════════════════
   Demo song data — mainSetup() from Onboarding.swift
   ═══════════════════════════════════════════════════════════════════════════ */

const BPM = 128;
const SWING = 0.05;

const INSTRUMENTS = [
  { icon: 'kick',  color: 0,  note: 36 },
  { icon: 'hihat', color: 8,  note: 60 },
  { icon: 'snare', color: 5,  note: 36 },
  { icon: 'hihat', color: 16, note: 60 },
  { icon: 'waves', color: 12, note: 48 },
];
const instColor = i => PALETTE[INSTRUMENTS[i].color];

function mkPattern(id, color, pages = 1) {
  return {
    id, color, pages,
    steps: Array.from({ length: pages }, () =>
      Array.from({ length: 16 }, () => ({ on: false, inst: 0 }))),
    notes: Array.from({ length: pages }, () =>
      Array.from({ length: 16 }, () => ({ active: false, note: 60 }))),
    lane: new Uint8Array(128),
  };
}
function setFromArray(p, values) {
  values.forEach((v, i) => {
    p.steps[0][i].on = v !== null;
    p.steps[0][i].inst = v ?? 0;
  });
}

const patterns = {};
for (let i = 0; i <= 8; i++) patterns[i] = mkPattern(i, 0);

setFromArray(patterns[0], [0,null,null,null, 0,null,null,null, 0,null,null,null, 0,null,null,null]);
setFromArray(patterns[1], [0,null,null,null, 0,null,null,null, 0,null,null,null, 0,null,null,null]);
setFromArray(patterns[2], [0,null,1,null, 0,null,1,null, 0,null,1,null, 0,null,1,null]);
setFromArray(patterns[3], [0,null,1,null, 0,null,1,null, 0,null,1,null, 0,null,1,null]);
setFromArray(patterns[4], [null,null,null,null, 2,null,null,null, null,null,null,null, 2,null,null,null]);
setFromArray(patterns[6], [null,null,null,null, 2,null,null,null, null,null,null,null, 2,null,null,null]);
setFromArray(patterns[5], [3,3,3,3, 3,3,3,3, 3,3,3,3, 3,3,3,3]);
setFromArray(patterns[7], [1,null,1,null, 1,null,1,null, 1,null,1,null, 1,null,1,null]);

// Pre-fill p5's automation lane with a ramp
for (let i = 0; i < 128; i++) patterns[5].lane[i] = Math.min(255, Math.round(i / 127 * 255));

// p8: two-page Euclidean arp E(5,16), Cm7 notes cycled over the hits
{
  const p = mkPattern(8, 0, 2);
  const hits = [0, 3, 6, 9, 12];
  const arpNotes = [48, 51, 55, 58];
  let ni = 0;
  for (let page = 0; page < 2; page++) {
    for (const s of hits) {
      p.steps[page][s].on = true;
      p.steps[page][s].inst = 4;
      p.notes[page][s].active = true;
      p.notes[page][s].note = arpNotes[ni % arpNotes.length];
      ni++;
    }
  }
  patterns[8] = p;
}

// Pattern grid (segment 0): grid[row][col] = pattern id or null
const grid = [
  [0, 4,    5,    8   ],
  [1, 6,    7,    null],
  [2, null, null, null],
  [3, null, null, null],
];
function syncGridColors() {
  for (let r = 0; r < 4; r++)
    for (let c = 0; c < 4; c++)
      if (grid[r][c] !== null) patterns[grid[r][c]].color = r;
}
syncGridColors();

// Loop groups: sections = arrays of [voice0, voice1, voice2] pattern ids (null = empty)
const DRAG_DROP_GROUP = 4;
const VOICE_COUNT = 3;
let loopGroups = [
  { sections: [[3, 4, null]] },
  { sections: [[0, 5, null]] },
  { sections: [[0, null, null]] },
  { sections: [[0, 8, null], [0, null, null]] },
  { sections: [[0, null, null], [0, null, null]] },
];

function ensureDragDropGroupExists() {
  while (loopGroups.length <= DRAG_DROP_GROUP)
    loopGroups.push({ sections: [[null, null, null]] });
}

// Multi-page ghost resolution (ResolvedPatternCache)
function resolveCell(group, sIdx, vIdx) {
  const pid = group.sections[sIdx][vIdx];
  if (pid !== null && pid !== undefined) return { type: 'direct', pid, page: 0 };
  for (let k = 1; k <= sIdx; k++) {
    const src = group.sections[sIdx - k][vIdx];
    if (src !== null && src !== undefined) {
      if (patterns[src].pages > k) {
        // intermediate cells must be empty (they are, since we got here scanning back)
        return { type: 'ghost', pid: src, page: k };
      }
      break;
    }
  }
  return { type: 'empty' };
}

function dominantInstrument(p) {
  const counts = {};
  for (let pg = 0; pg < p.pages; pg++)
    for (const st of p.steps[pg])
      if (st.on) counts[st.inst] = (counts[st.inst] || 0) + 1;
  let best = null, bestN = -1;
  for (const [k, n] of Object.entries(counts))
    if (n > bestN || (n === bestN && +k < best)) { best = +k; bestN = n; }
  return best;
}
const patternIcon = p => { const d = dominantInstrument(p); return d === null ? null : INSTRUMENTS[d].icon; };

// LoopGroupsDetails.calculateStartTimes
function calcStartTimes() {
  let totalBeats = 0;
  return loopGroups.map(g => {
    const totalSeconds = totalBeats * 60 / BPM;
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    totalBeats += g.sections.length * 16;
    return `${m}:${String(s).padStart(2, '0')}`;
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   Mutable UI state
   ═══════════════════════════════════════════════════════════════════════════ */

const sel = {
  inst: 0,               // InstrumentSelection.currentIndex
  pattern: null,         // currently selected pattern id (grid tap)
  loopGroup: null,       // opened group in song view (screen 12)
  highlightedGroup: 0,   // song view highlighted card
};

// screen 4 dial values (base params)
const inst0 = { harmonics: 0.6 };
const inst1 = { morph: 0.3 };
const inst2 = { morph: 0.4 };
const inst3 = { morph: 0.1, laneOne: 0.4 };

// screens 5-7 state
let showPresetPanel = true;
let isDrawingAutomation = false;
const preset = { type: 'ramp', frequency: 1, reverse: false, top: 1, bottom: 0 };
let selectedPreset = [];   // filled by recalcPreset() once the generators exist below

// screen 8 state
let notesPageId = 0;
let notesScrollStep = 0;   // 0..16
let notesScrollNote = 0;   // vertical scale-degree offset
let notesVisiblePages = new Set([0]);

// screen 11 carousel state
let chainScroll = { offset: 0, centered: 0 };

/* ═══════════════════════════════════════════════════════════════════════════
   Preset generators (AutomationPresetEditor)
   ═══════════════════════════════════════════════════════════════════════════ */

const AUTO_W = 128;
function genRamp()     { return Array.from({ length: AUTO_W }, (_, i) => i / AUTO_W); }
function genSteps()    { const seg = AUTO_W / 4; return Array.from({ length: AUTO_W }, (_, i) => [0, 0.5, 1, 0.5][Math.floor(i / seg)] ?? 0); }
function genShelf()    { return Array.from({ length: AUTO_W }, (_, i) => i < AUTO_W / 2 ? 0 : 1); }
function genHalfRamp() { const mid = AUTO_W / 2; return Array.from({ length: AUTO_W }, (_, i) => i < mid ? 0 : (i - mid) / (mid - 1)); }

function repeatWithFixedStride(arr, repeats) {
  if (repeats < 1) return [];
  const out = [];
  for (let r = 0; r < repeats; r++)
    for (let i = 0; i < arr.length; i += repeats) out.push(arr[i]);
  return out;
}

function recalcPreset() {
  let result;
  switch (preset.type) {
    case 'ramp':     result = genRamp(); break;
    case 'halfRamp': result = genHalfRamp(); break;
    case 'steps':    result = genSteps(); break;
    case 'drop':     result = genShelf(); break;
  }
  if (preset.reverse) result = result.slice().reverse();
  const distance = preset.top - preset.bottom;
  result = result.map(v => v * distance + preset.bottom);
  selectedPreset = repeatWithFixedStride(result, preset.frequency);
}

selectedPreset = genRamp();

function applyPresetToLane() {
  const lane = patterns[5].lane;
  const count = lane.length;
  for (let i = 0; i < count; i++) {
    const idx = count > 1 ? Math.floor(i / (count - 1) * (selectedPreset.length - 1)) : 0;
    const v = selectedPreset[Math.max(0, Math.min(idx, selectedPreset.length - 1))];
    lane[i] = Math.round(Math.max(0, Math.min(1, v)) * 255);
  }
  audio.sendHatLane();
}

/* ═══════════════════════════════════════════════════════════════════════════
   Audio — kick_engine WASM worklet (harness protocol from index-interactive.html)
   ═══════════════════════════════════════════════════════════════════════════ */

const P = {
  SubGain:0, SubDecay:1, TransientGain:2, TransientDecay:3,
  NoiseGain:4, NoiseDecay:5, NoiseLowPass:6, NoiseHighPass:7,
  NoiseResonance:8, OverdriveAmt:9, ReverbSend:10,
};
const DEF_BASE = [
  [1.0,  0.35, 1.0,  0.08, 0.25, 0.06, 0.50, 0.20, 0.30, 0.0, 0.0],  // kick
  [0.0,  0.2,  0.0,  0.05, 0.9,  0.08, 0.88, 0.65, 0.65, 0.0, 0.0],  // hat
  [0.45, 0.18, 0.35, 0.05, 1.0,  0.22, 0.78, 0.35, 0.52, 0.0, 0.15], // snare
];
const SW_P = { SPREAD:0, DRIFT:1, DECAY:2, CUTOFF:3, REVERB:4, GAIN:5, DELAY:6, ENV_AMT:7 };

const audio = {
  actx: null, wNode: null, playing: false, failed: false,
  // conductor
  mode: { type: 'none' },           // none | pattern {pid} | group {idx} | song {startGroup}
  pos: { sectionIdx: 0, groupIdx: 0 },
  current: null,                    // what's sounding this bar {patternPages:{pid:page}, sectionKey, laneOn}
  pending: null,
  step: -1,

  // resume() can stay pending indefinitely when the browser withholds audio
  // permission — never let it block navigation, just nudge it and move on.
  nudgeResume() {
    if (this.actx && this.actx.state !== 'running') this.actx.resume().catch(() => {});
  },

  async init() {
    if (this.actx) { this.nudgeResume(); return; }
    if (this.failed) return;
    try {
      this.actx = new AudioContext({ sampleRate: 48000 });
      const gain = this.actx.createGain();
      gain.gain.value = 1;
      gain.connect(this.actx.destination);
      this.nudgeResume();
      await this.actx.audioWorklet.addModule('kick-worklet-bundle.js');
      const wasmBuf = await fetch('kick_engine.wasm').then(r => {
        if (!r.ok) throw new Error('wasm missing');
        return r.arrayBuffer();
      });
      this.wNode = new AudioWorkletNode(this.actx, 'kick-processor', {
        outputChannelCount: [2], numberOfOutputs: 1,
      });
      this.wNode.port.onmessage = ({ data }) => {
        if (data.type === 'step') this.onStep(data.step);
      };
      this.wNode.connect(gain);
      this.wNode.port.postMessage({ type: 'init', sr: this.actx.sampleRate, wasmBuf }, [wasmBuf]);
      this.send({ type: 'set_bpm', bpm: BPM });
      this.send({ type: 'set_swing', amount: SWING });
      this.send({ type: 'set_reverb', decay: 0.994, lowPass: 20 * Math.pow(1200, 0.7) / 48000, preDelay: 0.5, ret: 1.0 });
      for (let v = 0; v < 3; v++)
        for (let p = 0; p < 11; p++)
          this.send({ type: 'set_base', v, param: p, value: DEF_BASE[v][p] });
      this.pushDialParams();
      const swarmDefs = { SPREAD:0.35, DRIFT:0.25, DECAY:0.3, CUTOFF:0.6, REVERB:0.4, GAIN:0.8, DELAY:0.0, ENV_AMT:0.0 };
      for (const [k, v] of Object.entries(swarmDefs))
        this.send({ type: 'set_swarm_param', param: SW_P[k], value: v });
      this.sendHatLane();
    } catch (e) {
      console.warn('Audio init failed (visual-only mode):', e);
      this.failed = true;
      this.actx = null;
      this.wNode = null;
    }
  },

  send(msg) { if (this.wNode) this.wNode.port.postMessage(msg); },

  pushDialParams() {
    // screen-4 dials → engine approximations
    this.send({ type: 'set_base', v: 0, param: P.OverdriveAmt, value: inst0.harmonics * 0.5 });
    this.send({ type: 'set_base', v: 2, param: P.NoiseDecay, value: 0.08 + inst2.morph * 0.3 });
  },
  pushHatDecayFrom(v) {
    this.send({ type: 'set_base', v: 1, param: P.NoiseDecay, value: 0.02 + v * 0.3 });
  },

  sendHatLane() {
    // Pattern lane scaled by the laneOne mod amount (screen 7's dial)
    const amt = inst3.laneOne;
    const buf = new Uint8Array(128);
    const laneActive = this.current && this.current.laneOn;
    for (let i = 0; i < 128; i++) {
      const v = laneActive ? 128 + (patterns[5].lane[i] - 128) * amt : 128;
      buf[i] = Math.max(0, Math.min(255, Math.round(v)));
    }
    this.send({ type: 'set_lane', v: 1, buf: buf.buffer });
  },

  setMode(mode) {
    this.mode = mode;
    this.pos = { sectionIdx: 0, groupIdx: mode.type === 'song' ? (mode.startGroup ?? 0) : (mode.idx ?? 0) };
    if (mode.type === 'none') {
      if (this.playing) { this.send({ type: 'stop' }); this.playing = false; }
      this.step = -1;
      this.current = null;
      widgets.forEach(w => w.draw && w.draw());
      return;
    }
    this.programBar(true);
    this.current = this.pending;
    this.sendHatLane();
    if (!this.playing && this.wNode) { this.send({ type: 'play' }); this.playing = true; }
  },

  // Compute the bar that should sound next and push it to the engine
  programBar(immediate) {
    const kick = new Array(16).fill(false);
    const hat = new Array(16).fill(false);
    const snare = new Array(16).fill(false);
    const swarm = new Array(16).fill(null);
    const patternPages = {};
    let laneOn = false;
    let sectionKey = null;

    const addPattern = (pid, page) => {
      const p = patterns[pid];
      if (!p || page >= p.pages) return;
      patternPages[pid] = page;
      if (pid === 5) laneOn = true;
      for (let s = 0; s < 16; s++) {
        const st = p.steps[page][s];
        if (!st.on) continue;
        if (st.inst === 0) kick[s] = true;
        else if (st.inst === 1 || st.inst === 3) hat[s] = true;
        else if (st.inst === 2) snare[s] = true;
        else if (st.inst === 4) swarm[s] = p.notes[page][s].active ? p.notes[page][s].note : INSTRUMENTS[4].note;
      }
    };

    const m = this.mode;
    if (m.type === 'pattern') {
      addPattern(m.pid, 0);
    } else if (m.type === 'group' || m.type === 'song') {
      let gIdx = m.type === 'group' ? m.idx : this.pos.groupIdx;
      gIdx = ((gIdx % loopGroups.length) + loopGroups.length) % loopGroups.length;
      const g = loopGroups[gIdx];
      const len = g.sections.length;
      const sIdx = ((this.pos.sectionIdx % len) + len) % len;
      sectionKey = gIdx + ':' + sIdx;
      for (let v = 0; v < VOICE_COUNT; v++) {
        const cell = resolveCell(g, sIdx, v);
        if (cell.type !== 'empty') addPattern(cell.pid, cell.page);
      }
    }

    for (let s = 0; s < 16; s++) {
      this.send({ type: 'set_step', v: 0, step: s, active: kick[s], vel: 0.85 });
      this.send({ type: 'set_step', v: 1, step: s, active: hat[s], vel: 0.6 });
      this.send({ type: 'set_step', v: 2, step: s, active: snare[s], vel: 0.8 });
      this.send({ type: 'set_swarm_step', step: s, active: swarm[s] !== null, note: swarm[s] ?? 48, vel: 0.7 });
    }
    this.pending = { patternPages, sectionKey, laneOn };
    if (immediate) this.current = this.pending;
  },

  advance() {
    const m = this.mode;
    if (m.type === 'group') {
      const g = loopGroups[Math.min(m.idx, loopGroups.length - 1)];
      this.pos.sectionIdx = (this.pos.sectionIdx + 1) % g.sections.length;
    } else if (m.type === 'song') {
      const g = loopGroups[this.pos.groupIdx];
      this.pos.sectionIdx++;
      if (this.pos.sectionIdx >= g.sections.length) {
        this.pos.sectionIdx = 0;
        if (sel.loopGroup !== null) {
          this.pos.groupIdx = sel.loopGroup;      // opened group loops
        } else {
          this.pos.groupIdx = (this.pos.groupIdx + 1) % loopGroups.length;
        }
      }
    }
  },

  // Screen index the pending bar was programmed for (null = programmed for the
  // current screen). The visual flip at step 0 must only happen when the bar that
  // is starting was actually armed for the target — a click landing between
  // step 15 and step 0 waits one more bar, keeping audio and visuals in sync.
  armedFor: null,

  onStep(step) {
    this.step = step;
    if (step === 15) {
      // Pre-arm: a queued screen switch changes the audio just before the bar line
      if (nav.changingTo !== null) {
        const target = SCREENS[nav.changingTo];
        this.applyScreenAudio(target, true);
        this.armedFor = nav.changingTo;
      } else {
        this.advance();
        this.armedFor = null;
      }
      this.programBar(false);
    } else if (step === 0) {
      this.current = this.pending || this.current;
      this.sendHatLane();
      if (nav.changingTo !== null && this.armedFor === nav.changingTo) {
        this.armedFor = null;
        nav.completeTransition();
      }
    }
    widgets.forEach(w => w.onStep && w.onStep(step));
  },

  applyScreenAudio(screen, preArm) {
    const qa = screen.audio;
    if (!qa || qa.type === 'none') {
      if (!preArm) this.setMode({ type: 'none' });
      return;
    }
    if (qa.type === 'pattern') {
      this.mode = { type: 'pattern', pid: qa.pid };
      this.pos = { sectionIdx: 0, groupIdx: 0 };
    } else if (qa.type === 'group') {
      this.mode = { type: 'group', idx: qa.idx };
      this.pos = { sectionIdx: 0, groupIdx: qa.idx };
    } else if (qa.type === 'song') {
      this.mode = { type: 'song', startGroup: 0 };
      this.pos = { sectionIdx: 0, groupIdx: 0 };
    }
    if (!preArm) {
      this.programBar(true);
      this.sendHatLane();
      if (!this.playing && this.wNode) { this.send({ type: 'play' }); this.playing = true; }
    }
  },

  // The app's forceReset: hard-restart the transport at the start of the focused
  // group so selecting a group is audible immediately, not at the next wrap.
  restartGroup(idx) {
    if (this.mode.type === 'group') this.mode.idx = idx;
    this.pos = { sectionIdx: 0, groupIdx: idx };
    this.forceRestart();
  },

  forceRestart() {
    if (!this.wNode) return;
    this.programBar(true);
    this.sendHatLane();
    this.send({ type: 'stop' });
    this.send({ type: 'play' });
    this.step = -1;
    this.playing = true;
    this.armedFor = null;
    widgets.forEach(w => w.draw && w.draw());
  },
};

/* ═══════════════════════════════════════════════════════════════════════════
   DOM helpers
   ═══════════════════════════════════════════════════════════════════════════ */

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const ch of children) {
    if (ch == null) continue;
    el.append(ch instanceof Node ? ch : document.createTextNode(ch));
  }
  return el;
}

function tbtn(label, opts = {}) {
  const b = h('button', { class: 'tbtn' + (opts.small ? ' small' : '') + (opts.caption ? ' caption' : '') });
  const ti = h('span', { class: 'ti' });
  if (typeof label === 'string') ti.textContent = label; else ti.append(label);
  b.append(ti);
  if (opts.color) b.style.setProperty('--btnc', opts.color);
  if (opts.selected) b.classList.add('selected');
  if (opts.onclick) b.addEventListener('click', opts.onclick);
  return b;
}

function textPanel(title, lines = []) {
  const p = h('div', { class: 'tpanel' }, h('h1', {}, title));
  for (const line of lines) {
    const el = h('p');
    if (line === '') el.innerHTML = '&nbsp;';
    else el.textContent = line;
    p.append(el);
  }
  return p;
}

/* ═══════════════════════════════════════════════════════════════════════════
   Widgets (canvas components) — registry redrawn on engine steps
   ═══════════════════════════════════════════════════════════════════════════ */

let widgets = [];

/* ── CanvasSequencerPage: one row of 8 steps ─────────────────────────────── */
function seqRowWidget(pid, offset, steps = 8) {
  const wrap = h('div', { class: 'seqrow' });
  const canvas = h('canvas');
  wrap.append(canvas);
  const SEP = 2;
  let geom = null;

  function layout() {
    const w = canvas.offsetWidth || wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    const totalSep = steps > 8 ? SEP * 3 : SEP;
    const stepSize = Math.floor(Math.min((w - totalSep) / steps, 9999));
    const hgt = stepSize;
    canvas.style.height = hgt + 'px';
    canvas.width = Math.round(w * DPR());
    canvas.height = Math.round(hgt * DPR());
    geom = { w, h: hgt, stepSize };
    draw();
  }

  function stepX(i) {
    // gutter before every 4th step
    return i * geom.stepSize + Math.floor(i / 4) * SEP - (i % 4 === 0 && i > 0 ? 0 : 0);
  }

  function draw() {
    if (!geom) return;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.clearRect(0, 0, geom.w, geom.h);
    const p = patterns[pid];
    const size = geom.stepSize;
    const ch = size * 0.2;
    const playingPage = audio.current ? audio.current.patternPages[pid] : undefined;
    const showPlay = playingPage === 0 && audio.step >= offset && audio.step < offset + steps && audio.playing;

    let x = 0;
    for (let i = 0; i < steps; i++) {
      const sIdx = offset + i;
      if (i > 0 && i % 4 === 0) x += SEP;
      // playhead square (drawn under the chamfered cell)
      if (showPlay && audio.step === sIdx) {
        ctx.fillStyle = C.lightg;
        ctx.fillRect(x, 0, size, size);
      }
      const st = p.steps[0][sIdx];
      ctx.fillStyle = st.on ? instColor(st.inst) : C.lightg;
      chamPath(ctx, x, 0, size, size, ch);
      ctx.fill();
      if (st.on) {
        const inset = size * 0.25;
        drawIcon(ctx, INSTRUMENTS[st.inst].icon, x + inset, 0 + inset, size - 2 * inset, C.bg);
      }
      x += size;
    }
  }

  function hit(e) {
    if (!geom) return -1;
    const r = canvas.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    if (cy < 0 || cy > geom.stepSize) return -1;
    let x = 0;
    for (let i = 0; i < steps; i++) {
      if (i > 0 && i % 4 === 0) x += SEP;
      if (cx >= x && cx < x + geom.stepSize) return offset + i;
      x += geom.stepSize;
    }
    return -1;
  }

  canvas.addEventListener('pointerdown', e => {
    const s = hit(e);
    if (s < 0) return;
    const st = patterns[pid].steps[0][s];
    if (st.on && st.inst === sel.inst) st.on = false;
    else { st.on = true; st.inst = sel.inst; }
    draw();
    if (audio.current && audio.current.patternPages[pid] !== undefined) audio.programBar(true);
  });

  const wdg = { el: wrap, layout, draw, onStep: () => draw() };
  widgets.push(wdg);
  return wdg;
}

/* ── Instrument chip list ────────────────────────────────────────────────── */
function instrumentChips(list) {
  const row = h('div', { class: 'chiprow' });
  const btns = list.map(i => {
    const b = h('button', { class: 'ichip tbtn small' });
    b.style.setProperty('--chipc', instColor(i));
    const ti = h('span', { class: 'ti' });
    ti.innerHTML = iconSvg(INSTRUMENTS[i].icon, 24);
    b.append(ti);
    b.addEventListener('click', () => { sel.inst = i; update(); });
    row.append(b);
    return b;
  });
  function update() {
    btns.forEach((b, k) => b.classList.toggle('selected', sel.inst === list[k]));
  }
  update();
  return row;
}

/* ── Dial (Dial.swift): 270° ring, gap at 6 o'clock ──────────────────────── */
function dialWidget(cfg) {
  // cfg: {caption, get(), set(v), defaultValue, modGet(), modSet(v), selectedMod() -> bool}
  const box = h('div', { class: 'dialbox' });
  const canvas = h('canvas');
  box.append(canvas);
  if (cfg.caption) box.append(h('div', { class: 'dial-caption' }, cfg.caption));

  let size = 0;
  let dragging = null;

  function layout() {
    const w = box.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    size = Math.min(w, isRegular() ? 112 : 80);
    const lw = size * 0.32;
    canvas.style.width = size + 'px';
    canvas.style.height = (size + lw * 0.5) + 'px';
    canvas.width = Math.round(size * DPR());
    canvas.height = Math.round((size + lw * 0.5) * DPR());
    draw();
  }

  const deg = d => d * Math.PI / 180;
  const START = 135, ARC = 270, END = 405, OVER = 4;

  function draw() {
    if (!size) return;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const lw = size * 0.32;
    ctx.clearRect(0, 0, size, size + lw);
    const cx = size / 2, cy = size / 2 + lw * 0.5;
    const rBase = (size - lw) / 2;
    const value = cfg.get();
    const modOn = cfg.selectedMod && cfg.selectedMod();
    const modAmt = cfg.modGet ? cfg.modGet() : 0;
    const hasRing = cfg.modGet && (modAmt !== 0 || (dragging && modOn));

    // track
    ctx.lineWidth = lw;
    ctx.strokeStyle = C.mid;
    ctx.beginPath(); ctx.arc(cx, cy, rBase, deg(START), deg(END)); ctx.stroke();
    // value
    if (value > 0.001) {
      ctx.strokeStyle = C.lightg;
      ctx.beginPath(); ctx.arc(cx, cy, rBase, deg(START), deg(START + value * ARC)); ctx.stroke();
    }
    // mod ring (laneOne = orange), anchored at the value, sweeping ± amount
    if (hasRing) {
      const slots = 1;
      const thick = lw / (slots + 1);
      const rRing = (size - thick) / 2;
      const anchor = START + value * ARC;
      const rawFar = anchor + modAmt * ARC;
      const far = Math.max(START - OVER, Math.min(END + OVER, rawFar));
      const a0 = Math.min(anchor, far), a1 = Math.max(anchor, far);
      ctx.lineWidth = thick;
      ctx.strokeStyle = C.orange;
      ctx.beginPath(); ctx.arc(cx, cy, rRing, deg(a0), deg(a1)); ctx.stroke();
      if (far !== rawFar) {
        ctx.fillStyle = C.orange;
        ctx.beginPath();
        ctx.arc(cx + rRing * Math.cos(deg(far)), cy + rRing * Math.sin(deg(far)), thick * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // readout
    const active = modOn ? modAmt : value;
    ctx.fillStyle = modOn ? C.orange : C.text;
    ctx.font = `500 ${Math.max(10, Math.round(size * 0.125))}px 'Geist Mono', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(Math.round(active * 100)), cx, cy);
  }

  canvas.addEventListener('pointerdown', e => {
    const modOn = cfg.selectedMod && cfg.selectedMod();
    dragging = {
      x: e.clientX, y: e.clientY,
      v: modOn ? cfg.modGet() : cfg.get(),
      mod: modOn,
    };
    capture(canvas, e);
    e.preventDefault();
    draw();
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = (dragging.y - e.clientY) * 0.006;
    const dx = (e.clientX - dragging.x) * 0.0025;
    let v = dragging.v + dy + dx;
    const minV = dragging.mod ? -1 : 0;
    v = Math.min(Math.max(v, minV), 1.04);
    if (v >= 0.5 && v < 0.54) v = 0.5;
    else if (v >= 0.54) v -= 0.04;
    if (!dragging.mod) {
      v = Math.min(Math.max(v, 0), 1);
      if (v < 0.03) v = 0;
      else if (v > 0.97) v = 1;
    } else {
      if (Math.abs(v) < 0.03) v = 0;
      else if (v > 0.97) v = 1;
      else if (v < -0.97) v = -1;
    }
    v = Math.round(v * 255) / 255;
    if (dragging.mod) cfg.modSet(v); else cfg.set(v);
    draw();
    e.preventDefault();
  });
  const stop = () => { dragging = null; draw(); };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('dblclick', () => {
    if (cfg.selectedMod && cfg.selectedMod()) cfg.modSet(0);
    else cfg.set(cfg.defaultValue ?? 0);
    draw();
  });

  const wdg = { el: box, layout, draw };
  widgets.push(wdg);
  return wdg;
}

/* ── Automation editor (MultiPageNoteEntry, mode .automation, 16 steps) ──── */
function autoEditorWidget(pid, opts = {}) {
  // opts: {drawing: () => bool, interactive: bool}
  const wrap = h('div', { class: 'auto-ed' });
  const laneCanvas = h('canvas');
  const stepCanvas = h('canvas');
  wrap.append(laneCanvas, stepCanvas);
  const LANE_H = 160;
  let geom = null;

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    const cellW = Math.floor(w / 16);
    const stepH = Math.min(cellW, 40);
    laneCanvas.style.height = LANE_H + 'px';
    laneCanvas.width = Math.round(w * DPR());
    laneCanvas.height = Math.round(LANE_H * DPR());
    stepCanvas.style.height = stepH + 'px';
    stepCanvas.width = Math.round(w * DPR());
    stepCanvas.height = Math.round(stepH * DPR());
    geom = { w, cellW, stepH };
    draw();
  }

  function drawLane() {
    const ctx = laneCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW } = geom;
    const H = LANE_H;
    ctx.clearRect(0, 0, w, H);

    // playhead column (accent 20%)
    if (audio.playing && audio.current && audio.current.patternPages[pid] !== undefined && audio.step >= 0) {
      ctx.fillStyle = 'rgba(125,251,253,0.2)';
      ctx.fillRect(cellW * audio.step, 0, cellW, H);
    }
    // odd-beat shading
    for (let i = 0; i < 16; i++) {
      if (Math.floor(i / 4) % 2 === 1) {
        ctx.fillStyle = 'rgba(58,63,75,0.4)';
        ctx.fillRect(cellW * i, 0, cellW, H);
      }
    }
    // dashed quarter lines
    ctx.strokeStyle = 'rgba(58,63,75,0.9)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 2]);
    for (let d = 1; d < 4; d++) {
      ctx.beginPath();
      ctx.moveTo(0, H * d / 4); ctx.lineTo(cellW * 16, H * d / 4);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // vertical cell lines
    ctx.strokeStyle = 'rgba(58,63,75,0.7)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 16; i++) {
      ctx.beginPath(); ctx.moveTo(cellW * i, 0); ctx.lineTo(cellW * i, H); ctx.stroke();
    }
    // orange automation polyline (128 sub-values)
    const lane = patterns[pid].lane;
    ctx.strokeStyle = C.orange;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 128; i++) {
      const x = cellW * (Math.floor(i / 8) + (i % 8) / 8);
      const y = H * (1 - lane[i] / 255);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // beat separators
    drawBeatSeparators(ctx, cellW, H);
  }

  function drawBeatSeparators(ctx, cellW, H) {
    for (let i = 4; i < 16; i += 4) {
      const x = cellW * i;
      ctx.strokeStyle = C.bg; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      ctx.strokeStyle = 'rgba(139,147,166,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
  }

  function drawSteps() {
    const ctx = stepCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW, stepH } = geom;
    ctx.clearRect(0, 0, w, stepH);
    const p = patterns[pid];
    const ch = stepH * 0.2;
    const playing = audio.playing && audio.current && audio.current.patternPages[pid] !== undefined;
    for (let i = 0; i < 16; i++) {
      const x = cellW * i;
      if (playing && audio.step === i) {
        ctx.fillStyle = C.lightg;
        ctx.fillRect(x, 0, cellW, stepH);
      }
      const st = p.steps[0][i];
      ctx.fillStyle = st.on ? instColor(st.inst) : C.lightg;
      chamPath(ctx, x, 0, cellW, stepH, ch);
      ctx.fill();
      if (st.on) {
        const inset = Math.min(cellW, stepH) * 0.25;
        drawIcon(ctx, INSTRUMENTS[st.inst].icon,
          x + (cellW - (Math.min(cellW, stepH) - 2 * inset)) / 2, inset,
          Math.min(cellW, stepH) - 2 * inset, C.bg);
      }
    }
  }

  function draw() { if (geom) { drawLane(); drawSteps(); } }

  // Lane interaction: drawing mode = freehand; otherwise vertical bar-drag on one step
  if (opts.interactive !== false) {
    let drag = null;
    const setAt = (x, y) => {
      const sub = Math.max(0, Math.min(127, Math.floor(x / (geom.cellW * 16) * 128)));
      const v = Math.max(0, Math.min(1, (LANE_H - y) / LANE_H));
      patterns[pid].lane[sub] = Math.round(v * 255);
      return sub;
    };
    const setRange = (x0, y0, x1, y1) => {
      let a = Math.floor(x0 / (geom.cellW * 16) * 128), b = Math.floor(x1 / (geom.cellW * 16) * 128);
      let ya = y0, yb = y1;
      if (a > b) { [a, b] = [b, a]; [ya, yb] = [yb, ya]; }
      a = Math.max(0, Math.min(127, a)); b = Math.max(0, Math.min(127, b));
      const n = Math.max(1, b - a);
      for (let i = a; i <= b; i++) {
        const t = (i - a) / n;
        const y = ya + (yb - ya) * t;
        patterns[pid].lane[i] = Math.round(Math.max(0, Math.min(1, (LANE_H - y) / LANE_H)) * 255);
      }
    };
    laneCanvas.addEventListener('pointerdown', e => {
      if (!geom) return;
      const r = laneCanvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const drawingMode = opts.drawing ? opts.drawing() : false;
      if (drawingMode) {
        setAt(x, y);
        drag = { mode: 'draw', last: { x, y } };
      } else {
        // single-bar mode: lock to the starting step, drag sets its 8 sub-values
        const step = Math.max(0, Math.min(15, Math.floor(x / geom.cellW)));
        const v = Math.max(0, Math.min(1, (LANE_H - y) / LANE_H));
        for (let k = 0; k < 8; k++) patterns[pid].lane[step * 8 + k] = Math.round(v * 255);
        drag = { mode: 'bar', step };
      }
      capture(laneCanvas, e);
      audio.sendHatLane();
      drawLane();
      e.preventDefault();
    });
    laneCanvas.addEventListener('pointermove', e => {
      if (!drag || !geom) return;
      const r = laneCanvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      if (drag.mode === 'draw') {
        setRange(drag.last.x, drag.last.y, x, y);
        drag.last = { x, y };
      } else {
        const v = Math.max(0, Math.min(1, (LANE_H - y) / LANE_H));
        for (let k = 0; k < 8; k++) patterns[pid].lane[drag.step * 8 + k] = Math.round(v * 255);
      }
      audio.sendHatLane();
      drawLane();
      e.preventDefault();
    });
    const end = () => { drag = null; };
    laneCanvas.addEventListener('pointerup', end);
    laneCanvas.addEventListener('pointercancel', end);

    stepCanvas.addEventListener('pointerdown', e => {
      if (!geom) return;
      const r = stepCanvas.getBoundingClientRect();
      const i = Math.max(0, Math.min(15, Math.floor((e.clientX - r.left) / geom.cellW)));
      const st = patterns[pid].steps[0][i];
      if (st.on && st.inst === sel.inst) st.on = false;
      else { st.on = true; st.inst = sel.inst; }
      drawSteps();
      if (audio.current && audio.current.patternPages[pid] !== undefined) audio.programBar(true);
    });
  } else {
    laneCanvas.style.pointerEvents = 'none';
    stepCanvas.style.pointerEvents = 'none';
  }

  const wdg = { el: wrap, layout, draw, onStep: () => draw() };
  widgets.push(wdg);
  return wdg;
}

/* ── Preset panel (NoteEntryPresetPanel) ─────────────────────────────────── */
function presetPanelWidget(onApply, onCancel) {
  const panel = h('div', { class: 'preset-panel' });
  const chart = h('div', { class: 'pp-chart' });
  const chartCanvas = h('canvas');
  const topHandle = h('div', { class: 'pp-handle' });
  const botHandle = h('div', { class: 'pp-handle' });
  chart.append(chartCanvas, topHandle, botHandle);

  const btnX2 = tbtn('x2', { small: true, onclick: () => { preset.frequency = Math.min(8, preset.frequency * 2); refresh(); } });
  const btnD2 = tbtn('/2', { small: true, onclick: () => { preset.frequency = Math.max(1, Math.floor(preset.frequency / 2)); refresh(); } });
  const revLbl = h('span'); revLbl.innerHTML = SVG_SWAP;
  const btnRev = tbtn(revLbl, { small: true, onclick: () => { preset.reverse = !preset.reverse; refresh(); } });

  const shapes = [
    { key: 'ramp',     d: 'M2 2 L18 18' },
    { key: 'halfRamp', d: 'M2 2 L10 18 L18 18' },
    { key: 'steps',    d: 'M2 18 L6 18 L6 10 L10 10 L10 2 L14 2 L14 10 L18 10' },
    { key: 'drop',     d: 'M2 18 L10 18 L10 2 L18 2' },
  ];
  const shapeBtns = shapes.map(s => {
    const icon = h('span', { class: 'pp-shape' });
    icon.innerHTML = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="${s.d}"/></svg>`;
    return tbtn(icon, { small: true, onclick: () => { preset.type = s.key; refresh(); } });
  });

  const left = h('div', { class: 'pp-left' }, btnX2, btnD2, btnRev);
  const right = h('div', { class: 'pp-right' }, ...shapeBtns);
  panel.append(
    h('div', { class: 'pp-top' }, left, chart, right),
    h('div', { class: 'pp-div' }),
    h('div', { class: 'pp-bottom' },
      tbtn('Cancel', { small: true, onclick: onCancel }),
      tbtn('Apply', { small: true, onclick: onApply })),
  );

  function layout() {
    const w = chart.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    chartCanvas.width = Math.round(w * DPR());
    chartCanvas.height = Math.round(120 * DPR());
    draw();
  }

  function draw() {
    const w = chart.offsetWidth;
    if (!w) return;
    const ctx = chartCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    ctx.clearRect(0, 0, w, 120);
    ctx.strokeStyle = C.orange;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < selectedPreset.length; i++) {
      const x = i * (w / (selectedPreset.length - 1));
      const y = 120 - selectedPreset[i] * 120;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // handles: top at the curve's end, bottom at the start (flipping with reverse)
    topHandle.style.left = (preset.reverse ? 0 : w) + 'px';
    topHandle.style.top = (120 * (1 - preset.top)) + 'px';
    botHandle.style.left = (preset.reverse ? w : 0) + 'px';
    botHandle.style.top = (120 * (1 - preset.bottom)) + 'px';
  }

  function refresh() {
    btnX2.classList.toggle('disabled', preset.frequency > 4);
    btnD2.classList.toggle('disabled', preset.frequency < 2);
    btnRev.classList.toggle('selected', preset.reverse);
    shapeBtns.forEach((b, i) => b.classList.toggle('selected', preset.type === shapes[i].key));
    recalcPreset();
    draw();
  }

  const round02 = v => Math.round(v / 0.2) * 0.2;
  function handleDrag(handle, which) {
    handle.addEventListener('pointerdown', e => {
      capture(handle, e);
      e.preventDefault();
    });
    handle.addEventListener('pointermove', e => {
      if (!handle.hasPointerCapture || !handle.hasPointerCapture(e.pointerId)) return;
      const r = chart.getBoundingClientRect();
      const v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / 120));
      if (which === 'top') {
        preset.top = round02(v);
        if (preset.top < preset.bottom) preset.bottom = preset.top;
      } else {
        preset.bottom = round02(v);
        if (preset.top < preset.bottom) preset.top = preset.bottom;
      }
      refresh();
    });
  }
  handleDrag(topHandle, 'top');
  handleDrag(botHandle, 'bottom');

  refresh();
  const wdg = { el: panel, layout, draw };
  widgets.push(wdg);
  return wdg;
}

/* ── Note grid (MultiPageNoteEntry, mode .notes, 2 pages) ────────────────── */
const SCALE_MINOR = [0, 2, 3, 5, 7, 8, 10];
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const midiName = n => NOTE_NAMES[n % 12] + Math.floor(n / 12);

function buildNotes(offset) {
  // NoteGridState.buildNotes: scale rows from baseNote 48 (C), count = scale+1
  const base = 48;
  const count = SCALE_MINOR.length + 1;
  let idx = 0 + offset;
  let octave = Math.floor(base / 12);
  const notes = [];
  for (let k = 0; k < count; k++) {
    while (idx >= SCALE_MINOR.length) { octave++; idx -= SCALE_MINOR.length; }
    while (idx < 0) { octave--; idx += SCALE_MINOR.length; }
    notes.push(SCALE_MINOR[idx] + octave * 12);
    idx++;
  }
  return notes;   // ascending
}

function noteGridWidget(pid, onPageChange) {
  const wrap = h('div', { class: 'note-ed' });
  const gridCanvas = h('canvas');
  const stepCanvas = h('canvas');
  wrap.append(gridCanvas, stepCanvas);
  const GRID_H = 208;
  let geom = null;
  const p = patterns[pid];
  const totalSteps = p.pages * 16;

  function rows() { return buildNotes(notesScrollNote); }

  function layout() {
    const w = wrap.offsetWidth;
    if (!w) { setTimeout(layout, 60); return; }
    const cellW = Math.floor(w / 16);
    const stepH = Math.min(cellW, 40);
    gridCanvas.style.height = GRID_H + 'px';
    gridCanvas.width = Math.round(w * DPR());
    gridCanvas.height = Math.round(GRID_H * DPR());
    stepCanvas.style.height = stepH + 'px';
    stepCanvas.width = Math.round(w * DPR());
    stepCanvas.height = Math.round(stepH * DPR());
    geom = { w, cellW, stepH, cellH: GRID_H / rows().length };
    draw();
  }

  function stepAt(absStep) {
    const page = Math.floor(absStep / 16);
    return { st: p.steps[page][absStep % 16], nt: p.notes[page][absStep % 16], page };
  }

  function reportPages() {
    const first = Math.floor(notesScrollStep / 16);
    const last = Math.floor((notesScrollStep + 15) / 16);
    notesVisiblePages = new Set();
    for (let k = first; k <= last; k++) notesVisiblePages.add(Math.min(k, p.pages - 1));
    notesPageId = Math.floor(notesScrollStep / 16);
    if (onPageChange) onPageChange();
  }

  function drawGrid() {
    const ctx = gridCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW } = geom;
    const notes = rows();
    const nRows = notes.length;
    const cellH = GRID_H / nRows;
    geom.cellH = cellH;
    ctx.clearRect(0, 0, w, GRID_H);

    // playhead column
    const playPage = audio.current ? audio.current.patternPages[pid] : undefined;
    if (audio.playing && playPage !== undefined && audio.step >= 0) {
      const abs = playPage * 16 + audio.step;
      const xi = abs - notesScrollStep;
      if (xi >= 0 && xi < 16) {
        ctx.fillStyle = 'rgba(125,251,253,0.2)';
        ctx.fillRect(cellW * xi, 0, cellW, GRID_H);
      }
    }

    for (let xi = 0; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      if (abs >= totalSteps) break;
      const { st, nt } = stepAt(abs);
      for (let y = 0; y < nRows; y++) {
        const note = notes[nRows - y - 1];
        const isActive = st.on && ((nt.active && nt.note === note) ||
          (!nt.active && note === INSTRUMENTS[st.inst].note));
        const rx = cellW * xi, ry = cellH * y;
        if (!isActive) {
          if (xi === 0) {
            const isRoot = note % 12 === 0;
            ctx.fillStyle = isRoot ? C.lightg : C.mid;
            ctx.font = `500 10px 'Geist Mono', monospace`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(midiName(note), rx + cellW / 2, ry + cellH / 2 - 1);
          }
          continue;
        }
        ctx.fillStyle = instColor(st.inst);
        ctx.fillRect(rx, ry, cellW, cellH);
        ctx.fillStyle = C.bg;
        ctx.font = `500 10px 'Geist Mono', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(midiName(note), rx + cellW / 2, ry + cellH / 2 - 1);
      }
      // out-of-view indicators
      if (st.on && nt.active) {
        const lo = notes[0], hi = notes[nRows - 1];
        if (nt.note > hi) { ctx.fillStyle = instColor(st.inst); ctx.fillRect(cellW * xi, 0, cellW, cellH * 0.2); }
        if (nt.note < lo) { ctx.fillStyle = instColor(st.inst); ctx.fillRect(cellW * xi, GRID_H - cellH * 0.2, cellW, cellH * 0.2); }
      }
    }
    // ghost while moving a note
    if (moveDrag) {
      const gAbs = moveDrag.srcAbs + moveDrag.dStep;
      const xi = gAbs - notesScrollStep;
      const kIdx = moveDrag.srcRowK + moveDrag.dRow;
      if (xi >= 0 && xi < 16 && kIdx >= 0 && kIdx < nRows) {
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = instColor(4);
        ctx.fillRect(cellW * xi, cellH * (nRows - kIdx - 1), cellW, cellH);
        ctx.globalAlpha = 1;
      }
    }

    // odd-beat shading over cells (drawGrid comes after notes in the app)
    for (let xi = 0; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      if (Math.floor(abs / 4) % 2 === 1) {
        ctx.fillStyle = 'rgba(58,63,75,0.25)';
        ctx.fillRect(cellW * xi, 0, cellW, GRID_H);
      }
    }
    // horizontal lines
    ctx.strokeStyle = C.mid;
    ctx.lineWidth = 1;
    for (let y = 0; y <= nRows; y++) {
      ctx.beginPath(); ctx.moveTo(0, cellH * y); ctx.lineTo(cellW * 16, cellH * y); ctx.stroke();
    }
    // vertical lines
    ctx.strokeStyle = 'rgba(58,63,75,0.7)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= 16; x++) {
      ctx.beginPath(); ctx.moveTo(cellW * x, 0); ctx.lineTo(cellW * x, GRID_H); ctx.stroke();
    }
    // beat + page separators
    for (let xi = 1; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      const isPage = abs % 16 === 0;
      const isBeat = abs % 4 === 0;
      if (!isPage && !isBeat) continue;
      const x = cellW * xi;
      if (isPage) {
        ctx.strokeStyle = C.bg; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_H); ctx.stroke();
        ctx.strokeStyle = C.lightg; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x - 2, 0); ctx.lineTo(x - 2, GRID_H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 2, 0); ctx.lineTo(x + 2, GRID_H); ctx.stroke();
      } else {
        ctx.strokeStyle = C.bg; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_H); ctx.stroke();
        ctx.strokeStyle = 'rgba(139,147,166,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GRID_H); ctx.stroke();
      }
    }
  }

  function drawSteps() {
    const ctx = stepCanvas.getContext('2d');
    ctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
    const { w, cellW, stepH } = geom;
    ctx.clearRect(0, 0, w, stepH);
    const ch = stepH * 0.2;
    const playPage = audio.current ? audio.current.patternPages[pid] : undefined;
    for (let xi = 0; xi < 16; xi++) {
      const abs = notesScrollStep + xi;
      if (abs >= totalSteps) break;
      const { st, page } = stepAt(abs);
      const x = cellW * xi;
      if (audio.playing && playPage === page && audio.step === abs % 16) {
        ctx.fillStyle = C.lightg;
        ctx.fillRect(x, 0, cellW, stepH);
      }
      ctx.fillStyle = st.on ? instColor(st.inst) : C.lightg;
      chamPath(ctx, x, 0, cellW, stepH, ch);
      ctx.fill();
      if (st.on) {
        const s = Math.min(cellW, stepH);
        const inset = s * 0.25;
        drawIcon(ctx, INSTRUMENTS[st.inst].icon, x + (cellW - (s - 2 * inset)) / 2, inset, s - 2 * inset, C.bg);
      }
    }
  }

  function draw() { if (geom) { drawGrid(); drawSteps(); } }

  // interactions
  let pdrag = null;      // scroll drag
  let moveDrag = null;   // note move drag

  function cellFromEvent(e) {
    const r = gridCanvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const xi = Math.floor(x / geom.cellW);
    const yi = Math.floor(y / geom.cellH);
    const notes = rows();
    if (xi < 0 || xi >= 16 || yi < 0 || yi >= notes.length) return null;
    return { xi, yi, note: notes[notes.length - yi - 1], rowK: notes.length - yi - 1 };
  }

  gridCanvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const cell = cellFromEvent(e);
    pdrag = {
      x: e.clientX, y: e.clientY,
      startStep: notesScrollStep, startNote: notesScrollNote,
      moved: false, cell,
    };
    if (cell) {
      const abs = notesScrollStep + cell.xi;
      if (abs < totalSteps) {
        const { st, nt } = stepAt(abs);
        if (st.on && nt.active && nt.note === cell.note) {
          pdrag.candidateMove = { srcAbs: abs, srcNote: cell.note, srcRowK: cell.rowK };
        }
      }
    }
    capture(gridCanvas, e);
    e.preventDefault();
  });

  gridCanvas.addEventListener('pointermove', e => {
    if (!pdrag || !geom) return;
    const dx = e.clientX - pdrag.x;
    const dy = e.clientY - pdrag.y;
    if (!pdrag.moved && Math.hypot(dx, dy) < 8) return;
    pdrag.moved = true;

    if (pdrag.candidateMove) {
      moveDrag = {
        ...pdrag.candidateMove,
        dStep: Math.round(dx / geom.cellW),
        dRow: Math.round(-dy / geom.cellH),
      };
      drawGrid();
      return;
    }
    // scroll: horizontal steps + vertical scale degrees
    const maxOff = Math.max(0, totalSteps - 16);
    notesScrollStep = Math.max(0, Math.min(maxOff, pdrag.startStep + Math.round(dx / geom.cellW) * -1));
    const nOff = pdrag.startNote + Math.round(dy / geom.cellH) * -1 * -1;
    // vertical: dragging up shows higher notes (offset up)
    notesScrollNote = Math.max(-14, Math.min(21, pdrag.startNote + Math.round(dy / geom.cellH)));
    reportPages();
    draw();
  });

  gridCanvas.addEventListener('pointerup', e => {
    if (!pdrag) return;
    if (moveDrag) {
      // commit note move
      const src = stepAt(moveDrag.srcAbs);
      const tgtAbs = moveDrag.srcAbs + moveDrag.dStep;
      const notes = rows();
      const kIdx = moveDrag.srcRowK + moveDrag.dRow;
      if (tgtAbs >= 0 && tgtAbs < totalSteps && kIdx >= 0 && kIdx < notes.length &&
          (tgtAbs !== moveDrag.srcAbs || kIdx !== moveDrag.srcRowK)) {
        const tgt = stepAt(tgtAbs);
        src.st.on = false; src.nt.active = false;
        tgt.st.on = true; tgt.st.inst = 4;
        tgt.nt.active = true; tgt.nt.note = notes[kIdx];
      }
      moveDrag = null;
      if (audio.current) audio.programBar(true);
      draw();
    } else if (!pdrag.moved && pdrag.cell) {
      // tap: toggle note
      const abs = notesScrollStep + pdrag.cell.xi;
      if (abs < totalSteps) {
        const { st, nt } = stepAt(abs);
        const note = pdrag.cell.note;
        if (!st.on) {
          st.on = true; st.inst = sel.inst;
          nt.active = true; nt.note = note;
        } else {
          const activeNote = nt.active ? nt.note : INSTRUMENTS[st.inst].note;
          if (activeNote === note && st.inst === sel.inst) {
            st.on = false; nt.active = false;
          } else {
            st.on = true; st.inst = sel.inst;
            nt.active = true; nt.note = note;
          }
        }
        if (audio.current) audio.programBar(true);
        draw();
      }
    }
    pdrag = null;
  });
  gridCanvas.addEventListener('pointercancel', () => { pdrag = null; moveDrag = null; });

  stepCanvas.addEventListener('pointerdown', e => {
    if (!geom) return;
    const r = stepCanvas.getBoundingClientRect();
    const xi = Math.max(0, Math.min(15, Math.floor((e.clientX - r.left) / geom.cellW)));
    const abs = notesScrollStep + xi;
    if (abs >= totalSteps) return;
    const { st, nt } = stepAt(abs);
    if (st.on && st.inst === sel.inst) { st.on = false; }
    else {
      st.on = true; st.inst = sel.inst;
      if (!nt.active) { nt.active = true; nt.note = INSTRUMENTS[sel.inst].note; }
    }
    if (audio.current) audio.programBar(true);
    draw();
  });

  const wdg = {
    el: wrap, layout, draw,
    onStep: () => draw(),
    scrollToPage(page) {
      notesScrollStep = page * 16;
      reportPages();
      draw();
    },
  };
  widgets.push(wdg);
  return wdg;
}

/* ── Page selector (UnifiedPatternView.PageSelector, allowsResize: false) ── */
function pageSelectorWidget(pid, onSelect) {
  const p = patterns[pid];
  const wrap = h('div', { class: 'pagesel' });
  wrap.append(h('span', { class: 'ps-chip' }, 'Page'));
  const btns = [];
  for (let i = 0; i < p.pages; i++) {
    const b = h('button', { class: 'ps-btn' }, String(i + 1));
    const bar = h('span', { class: 'playbar' });
    b.append(bar);
    b.addEventListener('click', () => onSelect(i));
    btns.push({ b, bar });
    wrap.append(b);
  }
  function update() {
    const playPage = audio.playing && audio.current ? audio.current.patternPages[pid] : undefined;
    btns.forEach(({ b, bar }, i) => {
      b.classList.toggle('hl', notesVisiblePages.has(i));
      bar.classList.toggle('on', playPage === i);
    });
  }
  update();
  const wdg = { el: wrap, layout() {}, draw: update, onStep: update };
  widgets.push(wdg);
  return wdg;
}

/* ── Mod source selector (screen 7) ──────────────────────────────────────── */
let selectedMod = null; // null | 'laneOne'
function modSelectorWidget(dial) {
